<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Arena Cerdas Cermat MIPAS 2026 - Latihan Olimpiade & ANBK SD Kelas 4, 5, 6 dengan Supabase dan Vercel">
  <title>Arena Cerdas Cermat MIPAS 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <style>
    :root{
      --navy:#0f172a;--royal:#2563eb;--royal-dark:#1d4ed8;--sky:#38bdf8;
      --violet:#7c3aed;--gold:#f59e0b;--gold-light:#fef3c7;--mint:#10b981;
      --mint-light:#d1fae5;--red:#ef4444;--red-light:#fee2e2;--ink:#1e293b;
      --muted:#64748b;--line:#e2e8f0;--canvas:#f8fafc;--card:#ffffff;
      --radius:18px;--shadow:0 10px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.04);
      --font-main:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;font-family:var(--font-main);background:var(--canvas);color:var(--ink);line-height:1.5}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    input:focus,select:focus,textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
    textarea{resize:vertical;min-height:84px}
    .hide{display:none!important}

    /* Shell Layout */
    .shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    .sidebar{background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
    .logo{display:flex;gap:12px;align-items:center;padding:8px 8px 24px}
    .logo-emblem{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#ea580c);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(245,158,11,.3);flex-shrink:0}
    .logo strong{font-size:15px;display:block;letter-spacing:.3px;font-weight:800}
    .logo small{display:block;color:#94a3b8;font-size:11px;margin-top:2px}
    .nav-caption{font-size:11px;color:#64748b;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 10px 6px}
    .nav-button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;margin:3px 0;transition:background .15s,color .15s}
    .nav-button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-button.active{background:rgba(37,99,235,.2);color:#60a5fa;box-shadow:inset 3px 0 #3b82f6}
    .nav-ico{font-size:19px;width:24px;text-align:center;flex-shrink:0}
    .side-foot{margin-top:auto;padding:16px 10px 4px;border-top:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:11px;line-height:1.6}
    .side-cloud-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:700;margin-top:8px}
    .side-cloud-badge.online{background:rgba(16,185,129,.15);color:#34d399}
    .side-cloud-badge.offline{background:rgba(245,158,11,.15);color:#fbbf24}

    /* Main Area */
    .main{min-width:0;display:flex;flex-direction:column}
    .topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px;position:sticky;top:0;z-index:40}
    .topbar-title{font-size:17px;font-weight:800;color:var(--navy)}
    .topbar-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .topbar-badges{display:flex;align-items:center;gap:10px}
    .badge{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;font-size:11.5px;font-weight:700}
    .badge.royal{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
    .badge.green{background:var(--mint-light);color:#065f46;border:1px solid #a7f3d0}
    .badge.gold{background:var(--gold-light);color:#92400e;border:1px solid #fde68a}
    .content{max-width:1400px;width:100%;margin:0 auto;padding:28px 32px 64px}

    /* Hero Banner */
    .hero{background:linear-gradient(130deg,#1e3a8a 0%,#2563eb 55%,#7c3aed 100%);color:#fff;border-radius:24px;padding:36px 40px;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(37,99,235,.25);display:flex;align-items:center;justify-content:space-between;gap:24px}
    .hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-80px;top:-160px;background:rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.04)}
    .hero h1{margin:6px 0 10px;font-size:clamp(24px,2.8vw,36px);line-height:1.2;font-weight:900;letter-spacing:-.5px}
    .hero p{font-size:14px;color:#e0e7ff;margin:0 0 18px;max-width:620px;line-height:1.6}
    .hero-art{font-size:86px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));z-index:1;user-select:none}
    .eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:800;color:#fcd34d}

    /* Typography & Layout Grids */
    .heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 16px}
    .heading h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy)}
    .heading p{font-size:12.5px;color:var(--muted);margin:3px 0 0}
    .grid{display:grid;gap:18px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid #e2e8f0;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-width:0}

    /* Stats & Mode Cards */
    .stat{display:flex;gap:16px;align-items:center}
    .stat-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#f1f5f9;flex-shrink:0}
    .stat small{color:var(--muted);font-size:12px;font-weight:600}
    .stat strong{font-size:26px;display:block;margin-top:2px;font-weight:800;color:var(--navy)}
    .mode-card{border:1px solid #e2e8f0;border-radius:20px;background:#fff;padding:22px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
    .mode-card:hover{transform:translateY(-2px);border-color:#cbd5e1}
    .mode-icon{width:52px;height:52px;border-radius:16px;background:#f8fafc;display:grid;place-items:center;font-size:26px;margin-bottom:14px;box-shadow:inset 0 0 0 1px #e2e8f0}
    .mode-card h3{margin:0 0 6px;font-size:16.5px;font-weight:800;color:var(--navy)}
    .mode-card p{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.5;flex:1}
    .mode-card button{width:100%}

    /* Buttons */
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:13px;background:var(--royal);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.2);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
    .btn:hover{filter:brightness(1.08)}
    .btn:active{transform:scale(.98)}
    .btn.secondary{color:var(--royal);background:#eff6ff;box-shadow:none;border:1px solid #bfdbfe}
    .btn.ghost{color:var(--ink);background:#f1f5f9;box-shadow:none;border:1px solid #e2e8f0}
    .btn.good{background:var(--mint);box-shadow:0 4px 10px rgba(16,185,129,.2)}
    .btn.danger{background:var(--red);box-shadow:0 4px 10px rgba(239,68,68,.2)}
    .btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 10px rgba(245,158,11,.2)}
    .btn.sm{padding:8px 13px;font-size:12px;border-radius:9px}
    .btn.full{width:100%}
    .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    /* Forms & Inputs */
    .field{min-width:0}
    .field label{font-size:12px;color:#475569;font-weight:700;display:block;margin-bottom:6px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    .separator{border:0;border-top:1px solid var(--line);margin:20px 0}
    .subtle{color:var(--muted);font-size:12.5px;line-height:1.55}

    /* Notices & Alerts */
    .notice{border-radius:14px;padding:14px 18px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.6;border:1px solid #bfdbfe}
    .notice.warning{background:#fffbeb;color:#92400e;border-color:#fde68a}
    .notice.success{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9;color:#334155}
    .pill.blue{background:#eff6ff;color:#1d4ed8}
    .pill.green{background:#ecfdf5;color:#047857}
    .pill.red{background:#fef2f2;color:#b91c1c}
    .pill.gold{background:#fffbeb;color:#b45309}
    .pill.purple{background:#f5f3ff;color:#6d28d9}

    /* Quiz Layout */
    .quiz-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .timer{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#eff6ff;border-radius:14px;color:#1e40af;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;border:1px solid #bfdbfe}
    .timer.urgent{background:#fef2f2;color:#b91c1c;border-color:#fecaca;animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.65}}
    .progress{height:8px;background:#e2e8f0;overflow:hidden;border-radius:100px;margin:16px 0 20px}
    .progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .2s}
    .question-text{font-size:clamp(19px,2vw,27px);font-weight:800;line-height:1.45;white-space:pre-wrap;margin:16px 0 24px;color:var(--navy)}
    .option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;padding:16px 18px;border-radius:14px;margin:10px 0;color:var(--ink);font-size:15.5px;line-height:1.4;transition:border-color .15s,background .15s}
    .option:hover{border-color:#93c5fd;background:#f8fafc}
    .option.selected{border-color:#2563eb;background:#eff6ff}
    .option-letter{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;background:#f1f5f9;border-radius:10px;font-weight:800;color:#475569}
    .option.selected .option-letter{background:#2563eb;color:#fff}
    .number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .number-grid button{padding:10px 0;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;font-weight:800;font-size:13px}
    .number-grid button.done{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
    .number-grid button.current{background:#2563eb;color:#fff;border-color:#1d4ed8}
    .quiz-layout{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(240px,1fr);gap:18px}
    .question-control{display:flex;justify-content:space-between;gap:10px;margin-top:24px}

    /* Result View */
    .result-score{font-size:clamp(48px,6vw,80px);font-weight:900;color:#2563eb;letter-spacing:-4px;margin:4px 0}
    .result-answer{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
    .result-answer.correct{border-left:5px solid var(--mint)}
    .result-answer.wrong{border-left:5px solid var(--red)}
    .result-answer strong{display:block;margin-bottom:5px;color:var(--navy)}
    .result-answer p{margin:6px 0;font-size:12.5px;line-height:1.6;color:#475569}

    /* Final & Buzzer */
    .final-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
    .team-score{background:#fff;border:2px solid #e2e8f0;border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow)}
    .team-score:nth-child(1){border-top:6px solid #ef4444}
    .team-score:nth-child(2){border-top:6px solid #3b82f6}
    .team-score:nth-child(3){border-top:6px solid #10b981}
    .team-score h3{font-size:15px;margin:0 0 8px}
    .team-score strong{font-size:clamp(32px,3.8vw,54px);font-variant-numeric:tabular-nums;display:block;color:var(--navy);font-weight:900}
    .team-score.active{box-shadow:0 0 0 4px rgba(245,158,11,.35)}
    .buzzer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
    .buzzer{border:0;border-radius:18px;padding:28px 10px;color:#fff;font-weight:900;font-size:clamp(15px,1.8vw,23px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),0 10px 20px rgba(0,0,0,.15);touch-action:manipulation;user-select:none}
    .buzzer:nth-child(1){background:#ef4444}
    .buzzer:nth-child(2){background:#2563eb}
    .buzzer:nth-child(3){background:#10b981}
    .buzzer.winner{outline:6px solid var(--gold);outline-offset:2px}
    .buzzer:disabled{filter:grayscale(.7);opacity:.45}
    .score-action{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
    .podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:24px 0}
    .podium .place{width:30%;text-align:center;background:#eff6ff;border-radius:16px 16px 0 0;padding:16px 6px}
    .podium .place:nth-child(1){height:140px;order:2;background:#fef3c7}
    .podium .place:nth-child(2){height:115px;order:1}
    .podium .place:nth-child(3){height:95px;order:3}
    .podium strong{display:block;font-size:15px;margin:6px 0;color:var(--navy)}
    .podium span{font-size:32px}

    /* Data Table */
    .data-table{width:100%;border-collapse:collapse;font-size:12.5px}
    .data-table th{text-align:left;color:#475569;background:#f8fafc;padding:12px 10px;white-space:nowrap;font-weight:700}
    .data-table td{padding:12px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    .data-table td.question-cell{min-width:280px;max-width:540px}
    .scroll-x{overflow-x:auto}
    .top-spacer{height:14px}
    .load{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:24px;right:24px;z-index:1000;max-width:420px;background:#0f172a;color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.3);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.5;animation:slideUp .25s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .toast.error{background:#991b1b}
    .question-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .small-note{font-size:11px;color:#64748b;margin-top:6px}
    .loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);display:grid;place-items:center;z-index:900;backdrop-filter:blur(2px)}
    .loading-overlay>div{background:#fff;border-radius:20px;padding:24px 36px;text-align:center;color:var(--navy);font-weight:700;box-shadow:var(--shadow)}
    .bar{height:10px;background:#e2e8f0;border-radius:90px;overflow:hidden;margin:6px 0}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
    .empty{text-align:center;padding:45px 20px;color:#64748b}
    .empty strong{display:block;color:var(--navy);margin:8px 0;font-size:16px}
    .mobile-nav{display:none}

    /* =========================================================================
       HALAMAN RANGKUMAN MATERI (BARU)
       ========================================================================= */
    .summary-filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
    .filter-pills{display:flex;gap:8px;flex-wrap:wrap}
    .filter-btn{padding:7px 14px;border-radius:99px;border:1px solid #cbd5e1;background:#fff;color:#475569;font-size:12px;font-weight:700;transition:all .15s}
    .filter-btn:hover{background:#f8fafc;border-color:#94a3b8}
    .filter-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 3px 8px rgba(37,99,235,.25)}
    .search-box{position:relative;flex:1;max-width:380px;min-width:240px}
    .search-box input{padding-left:36px;border-radius:99px;font-size:13px}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;color:#94a3b8}

    .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
    .summary-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}
    .summary-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px -4px rgba(15,23,42,.1)}
    .summary-card-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
    .summary-card-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
    .summary-card.mtk .summary-card-icon{background:#eff6ff}
    .summary-card.ipa .summary-card-icon{background:#ecfdf5}
    .summary-card.ipas .summary-card-icon{background:#ecfdf5}
    .summary-card.ips .summary-card-icon{background:#fef3c7}
    .summary-card h3{margin:0;font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.35}
    .summary-category{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .summary-ringkasan{font-size:13px;color:#334155;line-height:1.6;margin-bottom:14px}
    
    .summary-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .summary-box-title{font-size:11.5px;font-weight:800;color:#475569;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .summary-box ul{margin:0;padding-left:18px;font-size:12.5px;color:#334155;line-height:1.6}
    .summary-box li{margin-bottom:4px}
    .summary-box li:last-child{margin-bottom:0}

    .formula-box{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-bottom:12px;color:#92400e}
    .formula-box-title{font-size:11.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .formula-box code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.7);padding:6px 9px;border-radius:6px;margin:4px 0;line-height:1.4;color:#78350f}

    .example-box{border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;background:#fbfcfe;margin-bottom:16px}
    .example-q{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
    .example-toggle{font-size:11.5px;color:#2563eb;cursor:pointer;font-weight:700;border:0;background:transparent;padding:0;text-decoration:underline}
    .example-ans{font-size:12px;color:#047857;margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e1;line-height:1.5}

    .summary-card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #f1f5f9;gap:10px}

    .warning-box{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid #ef4444;border-radius:12px;padding:12px 14px;margin-bottom:12px;color:#991b1b}
    .warning-box-title{font-size:11.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .warning-box ul{margin:0;padding-left:18px;font-size:12px;line-height:1.55}

    /* Ilustrasi SVG Edukatif pada Rangkuman */
    .summary-illustration{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;overflow:hidden}
    .summary-illustration svg{max-width:100%;height:auto;display:block;margin:0 auto}
    .illustration-caption{font-size:11px;color:#64748b;margin-top:8px;font-style:italic;text-align:center}

    /* Stimulus Gambar SVG pada Soal */

  </style>
  <!-- Supabase JS Client (Loaded from CDN with safe fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Konfigurasi Cloud Supabase Global -->
  <script src="supabase_config.js"></script>
  <!-- Data Soal Offline-First & Seed -->

</head>
<body>
  <div id="app">
    <div class="loading-overlay">
      <div>
        <span class="load"></span>
        <p style="margin-top:12px">Memuat Arena Cerdas Cermat...</p>
      </div>
    </div>
  </div>
  <div id="toast-container" aria-live="polite"></div>

  <script>
    'use strict';
    const APP_VERSION = '2.0.0';

    // State Aplikasi Global
    const S = {
      page: 'dashboard',
      boot: null,
      token: sessionStorage.getItem('ccAdminToken') || '',
      busy: false,
      clockOffset: 0,
      sound: localStorage.getItem('ccSound') !== 'false',
      
      // Supabase State
      supabase: null,
      supabaseConnected: false,
      supabaseUrl: (window.CC_SUPABASE_CONFIG && window.CC_SUPABASE_CONFIG.URL) || localStorage.getItem('ccSupabaseUrl') || '',
      supabaseKey: (window.CC_SUPABASE_CONFIG && window.CC_SUPABASE_CONFIG.ANON_KEY) || localStorage.getItem('ccSupabaseKey') || '',

      // Sesi Latihan & Ujian
      session: null,
      questionIndex: 0,
      answers: {},
      review: null,
      reviewOnlyWrong: false,
      reviewsList: null,

      // Bank Soal
      bank: null,
      bankFilter: { page: 0, search: '', mapel: '', kelas: '' },
      editing: null,

      // Evaluasi & Statistik
      stats: null,
      ranking: null,

      // Final & Buzzer
      final: null,
      buzzTeam: null,
      finalDeadline: null,
      finalExpired: false,
      showFinalAnswer: false,

      // Halaman Rangkuman
      summaryFilter: { mapel: '', kelas: '', search: '' },
      summaryOpenAnswers: {},

      // Latihan Mandiri Bagian & Sortir
      studentName: localStorage.getItem('cc_student_name') || '',
      practiceCategory: 'CAMPURAN',
      practiceSort: 'ACAK',

      // Review & Riwayat Murid
      reviewsFilter: 'ALL'
    };

    const $ = sel => document.querySelector(sel);
    const esc = x => String(x === null || x === undefined ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtDate = ms => new Date(Number(ms)).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
    const clock = seconds => {
      const s = Math.max(0, Math.floor(seconds));
      return Math.floor(s / 3600)
        ? `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
        : `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };

    function formatQuestionText(text, svgStimulus) {
      if (!text) return '';
      let svgBlock = '';
      if (svgStimulus) {
        svgBlock = `
          <div class="stimulus-svg-box" style="margin-bottom:14px;display:flex;justify-content:center;background:#fff;border-radius:10px;padding:8px">
            ${svgStimulus}
          </div>
        `;
      }
      if (text.includes('[STIMULUS]')) {
        const parts = text.split(/\[PERTANYAAN\]/i);
        const stimulusPart = parts[0].replace(/\[STIMULUS\]/i, '').trim();
        const questionPart = (parts[1] || '').trim();
        return `
          ${svgBlock}
          <div class="stimulus-card" style="margin-bottom:12px;background:#f8fafc;border-left:4px solid #3b82f6;padding:12px 16px;border-radius:6px;font-size:14.5px;line-height:1.6">
            ${esc(stimulusPart).replace(/\n/g, '<br>')}
          </div>
          <div class="standard-question-body" style="font-weight:600;font-size:15px;line-height:1.6">
            ${esc(questionPart).replace(/\n/g, '<br>')}
          </div>
        `;
      }
      return `${svgBlock}<div class="standard-question-body" style="font-size:15px;line-height:1.6">${esc(text).replace(/\n/g, '<br>')}</div>`;
    }

    function detectErrorCategory(q) {
      if (!q.chosen) return '⏰ Tidak Dijawab / Waktu Habis';
      const text = ((q.text || '') + ' ' + (q.topik || '')).toLowerCase();
      if (text.includes('[stimulus]') || text.includes('bacaan') || text.includes('tabel') || text.includes('pernyataan')) {
        return '🔍 Membaca Informasi & Stimulus';
      }
      if (q.mapel === 'MATEMATIKA') {
        if (text.includes('kabataku') || text.includes('kurung') || text.includes('hitung') || text.includes('operasi') || text.includes('pecahan')) {
          return '🧮 Ketelitian Hitung / Aturan Kabataku';
        }
        if (text.includes('kpk') || text.includes('fpb') || text.includes('rasio') || text.includes('skala') || text.includes('lingkaran') || text.includes('luas') || text.includes('volume')) {
          return '📐 Pemahaman Konsep & Rumus';
        }
        return '🧮 Ketelitian Perhitungan';
      }
      if (q.mapel === 'IPA') {
        if (text.includes('metamorfosis') || text.includes('wujud') || text.includes('gaya') || text.includes('tata surya') || text.includes('alveolus') || text.includes('darah')) {
          return '🧬 Konsep Biologi / Fisika Dasar';
        }
        return '🔬 Analisis Fakta Sains';
      }
      if (q.mapel === 'IPS') {
        if (text.includes('1928') || text.includes('1945') || text.includes('1908') || text.includes('sejarah') || text.includes('wita') || text.includes('wib')) {
          return '⏳ Kronologi Sejarah & Zona Wilayah';
        }
        return '🌏 Pemahaman Geografi & Sosial';
      }
      return '💡 Pemahaman Materi';
    }

    function toast(message, error = false) {
      const el = document.createElement('div');
      el.className = 'toast' + (error ? ' error' : '');
      el.textContent = message;
      $('#toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4600);
    }

    function busy(on) {
      S.busy = on;
      let el = $('#loader');
      if (on && !el) {
        document.body.insertAdjacentHTML('beforeend', '<div class="loading-overlay" id="loader"><div><span class="load"></span><p style="margin-top:12px">Memproses data...</p></div></div>');
      } else if (!on && el) {
        el.remove();
      }
    }

    async function run(call) {
      busy(true);
      try {
        return await call();
      } catch (e) {
        const message = e.message || String(e);
        toast(message, true);
        if (/Sesi guru kedaluwarsa/i.test(message)) {
          S.token = '';
          sessionStorage.removeItem('ccAdminToken');
          render();
        }
        throw e;
      } finally {
        busy(false);
      }
    }

    // =========================================================================
    // LAYER PENYIMPANAN & KONEKSI SUPABASE DENGAN FALLBACK LOKAL
    // =========================================================================
    
    // Inisialisasi Supabase Client jika URL dan Key tersedia
    async function initSupabase(url, key) {
      if (!url || !key) {
        S.supabase = null;
        S.supabaseConnected = false;
        return false;
      }
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          console.warn('Supabase JS library belum terpasang dari CDN. Menggunakan local storage.');
          return false;
        }
        const client = window.supabase.createClient(url.trim(), key.trim());
        
        // Tes query ringan ke cc_sessions atau cc_questions atau cc_settings
        let connected = false;
        const testSession = await client.from('cc_sessions').select('id').limit(1);
        if (!testSession.error || testSession.error.code === 'PGRST116') {
          connected = true;
        } else {
          const testQ = await client.from('cc_questions').select('id').limit(1);
          if (!testQ.error || testQ.error.code === 'PGRST116') {
            connected = true;
          } else {
            const testSet = await client.from('cc_settings').select('key').limit(1);
            if (!testSet.error || testSet.error.code === 'PGRST116') {
              connected = true;
            } else {
              console.warn('Uji koneksi Supabase gagal:', testSession.error?.message || testQ.error?.message);
            }
          }
        }
        S.supabase = client;
        S.supabaseConnected = connected;
        return connected;
      } catch (err) {
        console.error('Inisialisasi Supabase gagal:', err);
        S.supabaseConnected = false;
        return false;
      }
    }

    // Mengambil semua soal aktif (dari Supabase atau data lokal)
    async function dbGetQuestions() {
      const seed = typeof QUESTIONS_SEED !== 'undefined' ? QUESTIONS_SEED : [];
      if (S.supabaseConnected && S.supabase) {
        try {
          const allData = [];
          let from = 0;
          const pageSize = 1000;
          let hasMore = true;
          while (hasMore) {
            const { data, error } = await S.supabase
              .from('cc_questions')
              .select('*')
              .order('id')
              .range(from, from + pageSize - 1);
            if (error || !data || data.length === 0) {
              hasMore = false;
            } else {
              allData.push(...data);
              if (data.length < pageSize) hasMore = false;
              else from += pageSize;
            }
          }

          if (allData.length > 0) {
            const seedMap = new Map(seed.map(q => [q.ID_SOAL, q]));
            const mapped = allData.map(q => {
              const sQ = seedMap.get(q.id);
              return {
                ID_SOAL: q.id,
                MAPEL: q.mapel,
                KELAS: q.kelas,
                TOPIK: q.topik,
                BABAK: q.babak,
                LEVEL: q.level,
                TIPE: q.tipe,
                PERTANYAAN: q.pertanyaan,
                OPSI_A: q.opsi_a || '',
                OPSI_B: q.opsi_b || '',
                OPSI_C: q.opsi_c || '',
                OPSI_D: q.opsi_d || '',
                KUNCI: q.kunci,
                PEMBAHASAN: q.pembahasan || (sQ?.PEMBAHASAN || ''),
                DIAGNOSA: q.diagnosa || (sQ?.DIAGNOSA || ''),
                STIMULUS_GAMBAR: q.stimulus_gambar || (sQ?.STIMULUS_GAMBAR || null),
                STATUS: q.status || 'AKTIF'
              };
            });
            if (mapped.length < seed.length) {
              const mappedIds = new Set(mapped.map(q => q.ID_SOAL));
              seed.forEach(s => {
                if (!mappedIds.has(s.ID_SOAL)) mapped.push(s);
              });
            }
            return mapped;
          }
        } catch (e) {
          console.warn('Gagal memuat soal dari Supabase, beralih ke cache lokal:', e);
        }
      }
      // Fallback: Local Storage atau Seed
      const cached = localStorage.getItem('cc_questions_data');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length >= seed.length) {
            return parsed;
          }
        } catch (e) {}
      }
      return seed;
    }

    // Simpan data soal ke penyimpanan lokal
    function dbSaveLocalQuestions(questions) {
      try {
        localStorage.setItem('cc_questions_data', JSON.stringify(questions));
      } catch (e) {}
    }

    // Mengambil Pengaturan Aplikasi
    async function dbGetSettings() {
      const defaults = {
        NAMA_SEKOLAH: 'UPTD SPF SD Inpres Tangkala II',
        NAMA_PEMBINA: 'Budianto, S.Pd., Gr.',
        JUDUL: 'ARENA CERDAS CERMAT MIPAS 2026',
        PIN_GURU: '123456'
      };
      if (S.supabaseConnected && S.supabase) {
        try {
          const { data, error } = await S.supabase.from('cc_settings').select('*');
          if (!error && Array.isArray(data)) {
            const out = { ...defaults };
            data.forEach(r => { out[r.key] = r.value; });
            return out;
          }
        } catch (e) {}
      }
      const local = localStorage.getItem('cc_settings_data');
      return local ? { ...defaults, ...JSON.parse(local) } : defaults;
    }

    // Simpan Pengaturan Aplikasi
    async function dbSaveSettings(pairs) {
      if (S.supabaseConnected && S.supabase) {
        try {
          const upserts = Object.keys(pairs).map(k => ({ key: k, value: pairs[k], updated_at: new Date().toISOString() }));
          await S.supabase.from('cc_settings').upsert(upserts);
        } catch (e) {
          console.warn('Gagal menyimpan settings ke Supabase:', e);
        }
      }
      const current = await dbGetSettings();
      const updated = { ...current, ...pairs };
      localStorage.setItem('cc_settings_data', JSON.stringify(updated));
      return updated;
    }

    // Simpan sesi pengerjaan ke database Supabase dan lokal
    async function dbSaveSession(sessionData) {
      let cloudSaved = false;
      let cloudError = null;

      if (S.supabaseConnected && S.supabase) {
        try {
          const payload = {
            id: sessionData.id,
            id_tim: null, // Jangan kirim string acak agar tidak melanggar foreign key
            nama_tim: sessionData.teamName || sessionData.studentName || 'Murid Hebat',
            mode: sessionData.mode || 'LATIHAN_BAGIAN',
            mulai_ms: Number(sessionData.startedAt) || (Date.now() - 60000),
            batas_ms: sessionData.deadline ? Number(sessionData.deadline) : 0,
            selesai_ms: sessionData.finishedAt ? Number(sessionData.finishedAt) : Date.now(),
            skor: sessionData.score !== undefined ? Math.round(sessionData.score) : null,
            maks_skor: sessionData.maximum !== undefined ? Math.round(sessionData.maximum) : null,
            status: sessionData.finished ? 'SELESAI' : 'BERJALAN',
            soal_ids: sessionData.soalIds || (sessionData.questions || []).map(q => q.id || q.ID_SOAL),
            jawaban: sessionData.answers || {}
          };

          const { error } = await S.supabase
            .from('cc_sessions')
            .upsert(payload, { onConflict: 'id' });

          if (error) {
            console.error('Supabase upsert session error:', error);
            cloudError = error.message;
          } else {
            cloudSaved = true;
            console.log('✅ Sesi berhasil tersimpan di Supabase Cloud:', sessionData.id);
          }
        } catch (e) {
          console.error('Gagal sinkron sesi ke Supabase:', e);
          cloudError = e.message || String(e);
        }
      }

      // Simpan lokal
      const list = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]');
      const idx = list.findIndex(s => s.id === sessionData.id);
      if (idx >= 0) list[idx] = sessionData;
      else list.unshift(sessionData);
      localStorage.setItem('cc_sessions_list', JSON.stringify(list.slice(0, 100)));

      return { cloudSaved, cloudError };
    }

    // Mengambil riwayat sesi selesai (Gabungan Supabase Cloud + Lokal)
    async function dbGetCompletedSessions() {
      let cloudSessions = [];
      if (S.supabaseConnected && S.supabase) {
        try {
          const { data, error } = await S.supabase
            .from('cc_sessions')
            .select('*')
            .eq('status', 'SELESAI')
            .order('selesai_ms', { ascending: false })
            .limit(100);

          if (!error && Array.isArray(data)) {
            cloudSessions = data.map(r => ({
              id: r.id,
              teamName: r.nama_tim,
              team: r.nama_tim,
              studentName: (r.nama_tim || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || r.nama_tim,
              mode: r.mode,
              score: Number(r.skor) || 0,
              maximum: Number(r.maks_skor) || 0,
              max: Number(r.maks_skor) || 0,
              finishedAt: Number(r.selesai_ms) || Date.now(),
              finished: true,
              startedAt: Number(r.mulai_ms) || 0,
              duration: Math.max(0, Math.round(((Number(r.selesai_ms) || 0) - (Number(r.mulai_ms) || 0)) / 1000)),
              answers: r.jawaban || {},
              soalIds: r.soal_ids || [],
              source: 'cloud'
            }));
          } else if (error) {
            console.warn('Gagal query sesi dari Supabase:', error.message);
          }
        } catch (e) {
          console.warn('Gagal koneksi Supabase di dbGetCompletedSessions:', e);
        }
      }

      const localList = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]')
        .filter(s => s.finished)
        .map(s => ({
          ...s,
          team: s.teamName || s.team,
          teamName: s.teamName || s.team,
          studentName: s.studentName || (s.teamName || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || s.teamName,
          max: s.maximum || 0,
          finished: s.finishedAt || Date.now(),
          duration: Math.max(0, Math.round(((s.finishedAt || 0) - (s.startedAt || 0)) / 1000)),
          source: 'local'
        }));

      // Gabungkan tanpa duplikasi (Prioritaskan cloud jika sudah ada, atau gabungkan yang lokal)
      const map = new Map();
      cloudSessions.forEach(s => map.set(s.id, s));
      localList.forEach(s => {
        if (!map.has(s.id)) map.set(s.id, s);
      });

      const combined = Array.from(map.values()).sort((a, b) => (b.finishedAt || b.finished || 0) - (a.finishedAt || a.finished || 0));
      S.reviewsList = combined;
      return combined;
    }

    function publicQuestion(q) {
      return {
        id: q.ID_SOAL,
        mapel: q.MAPEL,
        kelas: Number(q.KELAS),
        topik: q.TOPIK,
        babak: q.BABAK,
        level: q.LEVEL,
        tipe: q.TIPE || 'PG',
        text: q.PERTANYAAN,
        options: [q.OPSI_A, q.OPSI_B, q.OPSI_C, q.OPSI_D].filter(Boolean),
        diagnosa: q.DIAGNOSA || '',
        svgStimulus: q.STIMULUS_GAMBAR || null
      };
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const api = {

        return {

          settings,
          serverNow: Date.now(),

          totalQuestions: active.length,

      async createSession(payload) {
        const all = (await dbGetQuestions()).filter(q => q.STATUS === 'AKTIF');
        const mode = (payload.mode || 'LATIHAN').toUpperCase();
        const teamName = (payload.teamName || 'Tim Cerdas').trim();
        let selected = [], seconds = 0;

        if (mode === 'PENYISIHAN' || mode === 'SEMIFINAL') {
          // 10 Matematika, 10 IPA, 10 IPS
          ['MATEMATIKA', 'IPA', 'IPS'].forEach(m => {
            const pool = all.filter(q => q.MAPEL === m && q.TIPE === 'PG');
            selected.push(...shuffle(pool).slice(0, 10));
          });
          selected = shuffle(selected);
          seconds = 2700; // 45 menit
        } else if (mode === 'REMEDIAL') {
          // Sesi Remedial Khusus Soal Salah
          selected = payload.questions || [];
          if (payload.sort !== 'URUT') selected = shuffle(selected);
          seconds = Math.max(1, selected.length) * 90; // 90 detik per soal
        } else if (mode === 'LATIHAN_BAGIAN') {
          const cat = payload.category || 'CAMPURAN';
          const part = Number(payload.part) || 1;
          const sort = payload.sort || 'ACAK';

          if (cat === 'CAMPURAN') {
            const poolMTK = all.filter(q => q.MAPEL === 'MATEMATIKA' && q.TIPE === 'PG');
            const poolIPA = all.filter(q => q.MAPEL === 'IPA' && q.TIPE === 'PG');
            const poolIPS = all.filter(q => q.MAPEL === 'IPS' && q.TIPE === 'PG');
            
            const startIdx = (part - 1) * 10;
            const mtkSlice = poolMTK.slice(startIdx, startIdx + 10);
            const ipaSlice = poolIPA.slice(startIdx, startIdx + 10);
            const ipsSlice = poolIPS.slice(startIdx, startIdx + 10);
            
            selected = [...mtkSlice, ...ipaSlice, ...ipsSlice];
            if (selected.length < 30) {
              const remaining = all.filter(q => !selected.includes(q) && q.TIPE === 'PG');
              selected.push(...remaining.slice(0, 30 - selected.length));
            }
          } else {
            const pool = all.filter(q => q.MAPEL === cat && q.TIPE === 'PG');
            const startIdx = (part - 1) * 30;
            selected = pool.slice(startIdx, startIdx + 30);
          }

          if (sort === 'ACAK') {
            selected = shuffle(selected);
          }
          // 45 menit = 2700 detik (atau 90 detik per soal jika sisa < 30)
          seconds = selected.length >= 30 ? 2700 : (selected.length * 90);
        } else {
          // Fallback Latihan Standar
          const count = Math.min(50, Math.max(5, Number(payload.count) || 10));
          let pool = all.filter(q => q.TIPE === 'PG');
          if (payload.mapel) pool = pool.filter(q => q.MAPEL === payload.mapel);
          selected = shuffle(pool).slice(0, count);
          seconds = payload.timed ? selected.length * 90 : 0;
        }

        const now = Date.now();
        const id = 'SESI-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        const sessionObj = {
          id,
          idTim: 'TIM-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
          mode,
          teamName,
          studentName: payload.studentName || teamName,
          startedAt: now,
          deadline: seconds ? now + seconds * 1000 : null,
          questions: selected.map(publicQuestion),
          soalIds: selected.map(q => q.ID_SOAL),
          answers: {},
          finished: false
        };

        await dbSaveSession(sessionObj);
        return sessionObj;
      },

      async saveAnswers(id, answers) {
        const session = S.session;
        if (session && session.id === id) {
          session.answers = answers;
          await dbSaveSession({ ...session, answers });
        }
        return { saved: true };
      },

      async submitSession(id, answers) {
        const allQuestions = await dbGetQuestions();
        const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
        const session = S.session;
        if (!session || session.id !== id) throw new Error('Sesi tidak ditemukan.');

        const pts = (session.mode === 'PENYISIHAN' || session.mode === 'SEMIFINAL') ? 4 : 1;
        const items = session.questions.map(pq => {
          const raw = qMap.get(pq.id);
          const chosen = answers[pq.id] || '';
          const correct = chosen && raw && chosen.toUpperCase() === raw.KUNCI.trim().toUpperCase();
          return {
            ...pq,
            chosen,
            correct: !!correct,
            answer: raw ? raw.KUNCI : '',
            explanation: raw ? raw.PEMBAHASAN : '',
            diagnosa: raw ? (raw.DIAGNOSA || '') : (pq.diagnosa || ''),
            points: correct ? pts : 0
          };
        });

        const score = items.reduce((s, it) => s + it.points, 0);
        const maximum = session.questions.length * pts;
        const correctCount = items.filter(it => it.correct).length;
        const finishedAt = Date.now();

        const review = {
          score,
          maximum,
          correct: correctCount,
          total: session.questions.length,
          items,
          finishedAt,
          teamName: session.teamName,
          studentName: session.studentName || session.teamName,
          mode: session.mode
        };

        session.finished = true;
        session.finishedAt = finishedAt;
        session.score = score;
        session.maximum = maximum;
        session.review = review;
        session.answers = answers;
        const saveStatus = await dbSaveSession(session);

        return { ...review, teamName: session.teamName, studentName: session.studentName || session.teamName, mode: session.mode, cloudSaved: saveStatus?.cloudSaved };
      },

      async importQuestions(token, inputs) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const questions = await dbGetQuestions();
        let imported = 0, skipped = 0;
        const upsertList = [];

        inputs.forEach(item => {
          if (!item.text || !item.answer) {
            skipped++;
            return;
          }
          const id = item.id || ('IMP-' + Math.random().toString(36).substr(2, 7).toUpperCase());
          const q = {
            ID_SOAL: id,
            MAPEL: (item.mapel || 'MATEMATIKA').toUpperCase(),
            KELAS: Number(item.kelas) || 4,
            TOPIK: item.topik || 'Umum',
            BABAK: item.babak || 'UMUM',
            LEVEL: item.level || 'SEDANG',
            TIPE: item.tipe || 'PG',
            PERTANYAAN: item.text,
            OPSI_A: (item.options || [])[0] || '',
            OPSI_B: (item.options || [])[1] || '',
            OPSI_C: (item.options || [])[2] || '',
            OPSI_D: (item.options || [])[3] || '',
            KUNCI: item.answer,
            PEMBAHASAN: item.explanation || '',
            STATUS: item.active !== false ? 'AKTIF' : 'NONAKTIF'
          };
          upsertList.push(q);
          const existing = questions.findIndex(x => x.ID_SOAL === id);
          if (existing >= 0) questions[existing] = q;
          else questions.push(q);
          imported++;
        });

        if (S.supabaseConnected && S.supabase && upsertList.length > 0) {
          try {
            const rows = upsertList.map(q => ({
              id: q.ID_SOAL,
              mapel: q.MAPEL,
              kelas: q.KELAS,
              topik: q.TOPIK,
              babak: q.BABAK,
              level: q.LEVEL,
              tipe: q.TIPE,
              pertanyaan: q.PERTANYAAN,
              opsi_a: q.OPSI_A,
              opsi_b: q.OPSI_B,
              opsi_c: q.OPSI_C,
              opsi_d: q.OPSI_D,
              kunci: q.KUNCI,
              pembahasan: q.PEMBAHASAN,
              status: q.STATUS
            }));
            await S.supabase.from('cc_questions').upsert(rows);
          } catch (e) {
            console.warn('Gagal import ke Supabase:', e);
          }
        }

        dbSaveLocalQuestions(questions);
        return { imported, skipped };
      },

      async getStatistics(token) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const sessions = await dbGetCompletedSessions();
        const allQuestions = await dbGetQuestions();
        const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));

        const totalSesi = sessions.length;
        const avgAcc = totalSesi
          ? Math.round(sessions.reduce((s, it) => s + (it.score / Math.max(1, it.max)) * 100, 0) / totalSesi)
          : 0;

        const subjectStats = { MATEMATIKA: { correct: 0, total: 0 }, IPA: { correct: 0, total: 0 }, IPS: { correct: 0, total: 0 } };
        const topicStats = {};

        sessions.slice(0, 50).forEach(s => {
          const ans = s.answers || {};
          (s.soalIds || []).forEach(qid => {
            const q = qMap.get(qid);
            if (!q) return;
            const chosen = ans[qid];
            const isCorrect = chosen && chosen.toUpperCase() === q.KUNCI.trim().toUpperCase();
            
            if (subjectStats[q.MAPEL]) {
              subjectStats[q.MAPEL].total++;
              if (isCorrect) subjectStats[q.MAPEL].correct++;
            }

            if (!topicStats[q.TOPIK]) topicStats[q.TOPIK] = { topic: q.TOPIK, correct: 0, total: 0 };
            topicStats[q.TOPIK].total++;
            if (isCorrect) topicStats[q.TOPIK].correct++;
          });
        });

        const weakTopics = Object.values(topicStats)
          .filter(t => t.total >= 3)
          .sort((a, b) => (a.correct / a.total) - (b.correct / b.total))
          .slice(0, 5);

        return {
          sessions: totalSesi,
          average: avgAcc,
          recent: sessions.slice(0, 50),
          subjectStats,
          weakTopics
        };
      },

      async leaderboard(token, mode) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const sessions = await dbGetCompletedSessions();
        const filtered = sessions.filter(s => s.mode === mode);
        const bestByTeam = new Map();

        filtered.forEach(s => {
          const prev = bestByTeam.get(s.team);
          if (!prev || s.score > prev.score || (s.score === prev.score && s.duration < prev.duration)) {
            bestByTeam.set(s.team, s);
          }
        });

        const sorted = Array.from(bestByTeam.values()).sort((a, b) => b.score - a.score || a.duration - b.duration);
        return sorted.map((s, idx) => ({
          rank: idx + 1,
          team: s.team,
          score: s.score,
          seconds: s.duration,
          qualified: idx < (mode === 'PENYISIHAN' ? 8 : 3)
        }));
      },

      // Pertandingan Final & Buzzer
      async createFinalMatch(token, teamNames) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = (await dbGetQuestions()).filter(q => q.STATUS === 'AKTIF');
        const used = new Set();

        const mandatory = [];
        for (let round = 0; round < 2; round++) {
          for (let team = 0; team < 3; team++) {
            ['MATEMATIKA', 'IPA', 'IPS'].forEach(subject => {
              const cand = all.filter(q => q.MAPEL === subject && !used.has(q.ID_SOAL));
              if (cand.length) {
                const picked = cand[0];
                used.add(picked.ID_SOAL);
                mandatory.push({ team, id: picked.ID_SOAL });
              }
            });
          }
        }

        const rebutan = [];
        ['MATEMATIKA', 'IPA', 'IPS'].forEach(subject => {
          const cand = all.filter(q => q.MAPEL === subject && !used.has(q.ID_SOAL)).slice(0, 5);
          cand.forEach(q => { used.add(q.ID_SOAL); rebutan.push(q.ID_SOAL); });
        });

        const extra = all.filter(q => !used.has(q.ID_SOAL)).map(q => q.ID_SOAL);

        const match = {
          id: 'FINAL-' + Date.now().toString(36).toUpperCase(),
          teams: teamNames.map((name, i) => ({ id: 'T' + (i + 1), name, score: 0 })),
          phase: 'WAJIB',
          wajib: mandatory,
          wajibIndex: 0,
          rebutan: shuffle(rebutan),
          rebutanIndex: 0,
          extra: shuffle(extra),
          extraIndex: 0,
          blockedTeams: [],
          logs: []
        };

        if (S.supabaseConnected && S.supabase) {
          try {
            await S.supabase.from('cc_final_matches').upsert({ id: match.id, state: match });
          } catch (e) {}
        }
        localStorage.setItem('cc_final_current', JSON.stringify(match));
        return api.matchView(match, all);
      },

      matchView(match, allQuestions) {
        let currentId = null, mandatoryTeam = null;
        if (match.phase === 'WAJIB') {
          const item = match.wajib[match.wajibIndex];
          if (item) { currentId = item.id; mandatoryTeam = item.team; }
        } else if (match.phase === 'REBUTAN') {
          currentId = match.rebutan[match.rebutanIndex];
        } else if (match.phase === 'TAMBAHAN') {
          currentId = match.extra[match.extraIndex];
        }

        const q = currentId ? allQuestions.find(it => it.ID_SOAL === currentId) : null;
        const total = match.phase === 'WAJIB' ? match.wajib.length : match.phase === 'REBUTAN' ? match.rebutan.length : null;
        const index = match.phase === 'WAJIB' ? match.wajibIndex : match.phase === 'REBUTAN' ? match.rebutanIndex : match.extraIndex;

        return {
          id: match.id,
          teams: match.teams,
          phase: match.phase,
          index,
          total,
          mandatoryTeam,
          eligible: [0, 1, 2].filter(t => !match.blockedTeams.includes(t)),
          question: q ? {
            ...publicQuestion(q),
            answer: q.KUNCI,
            answerText: ['A', 'B', 'C', 'D'].includes(q.KUNCI) ? q['OPSI_' + q.KUNCI] : q.KUNCI,
            explanation: q.PEMBAHASAN
          } : null,
          logs: match.logs.slice(-10)
        };
      },

      async getFinalMatch(token, id) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = await dbGetQuestions();
        const raw = localStorage.getItem('cc_final_current');
        if (!raw) throw new Error('Pertandingan final tidak ditemukan.');
        return api.matchView(JSON.parse(raw), all);
      },

      async adjudicateFinal(token, matchId, teamIndex, action) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = await dbGetQuestions();
        const raw = localStorage.getItem('cc_final_current');
        if (!raw) throw new Error('Pertandingan tidak ditemukan.');
        const match = JSON.parse(raw);

        const change = action === 'BENAR' ? 10 : action === 'SALAH' && match.phase !== 'WAJIB' ? -5 : 0;
        match.teams[teamIndex].score += change;
        match.logs.push({
          phase: match.phase,
          team: teamIndex,
          action,
          change,
          at: Date.now()
        });

        if (action === 'LEMPAR') {
          match.blockedTeams.push(teamIndex);
          if (match.blockedTeams.length >= 3) action = 'KOSONG';
        }

        if (action !== 'LEMPAR') {
          match.blockedTeams = [];
          if (match.phase === 'WAJIB') {
            match.wajibIndex++;
            if (match.wajibIndex >= match.wajib.length) match.phase = 'REBUTAN';
          } else if (match.phase === 'REBUTAN') {
            match.rebutanIndex++;
            if (match.rebutanIndex >= match.rebutan.length) {
              // Cek seri
              const scores = match.teams.map(t => t.score);
              const maxScore = Math.max(...scores);
              const tied = match.teams.filter(t => t.score === maxScore);
              match.phase = tied.length > 1 ? 'TAMBAHAN' : 'SELESAI';
            }
          } else if (match.phase === 'TAMBAHAN') {
            match.extraIndex++;
            const scores = match.teams.map(t => t.score);
            const maxScore = Math.max(...scores);
            const tied = match.teams.filter(t => t.score === maxScore);
            if (tied.length <= 1 || match.extraIndex >= match.extra.length) {
              match.phase = 'SELESAI';
            }
          }
        }

        if (S.supabaseConnected && S.supabase) {
          try {
            await S.supabase.from('cc_final_matches').upsert({ id: match.id, state: match });
          } catch (e) {}
        }
        localStorage.setItem('cc_final_current', JSON.stringify(match));
        return api.matchView(match, all);
      }
    };

    // AUDIO SOUND EFFECTS

    function sound(freq = 660) {
      if (!S.sound) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 160);
      } catch (e) {}
    }

    // =========================================================================
    // VIEW: LATIHAN MANDIRI BERBAGIAN (PART 1, PART 2... 30 SOAL / 45 MENIT)
    // =========================================================================
    function practiceView() {
      const all = typeof QUESTIONS_SEED !== 'undefined' ? QUESTIONS_SEED : [];
      const cat = S.practiceCategory || 'CAMPURAN';
      const sort = S.practiceSort || 'ACAK';
      
      const countMTK = all.filter(q => q.MAPEL === 'MATEMATIKA' && q.STATUS === 'AKTIF').length;
      const countIPA = all.filter(q => q.MAPEL === 'IPA' && q.STATUS === 'AKTIF').length;
      const countIPS = all.filter(q => q.MAPEL === 'IPS' && q.STATUS === 'AKTIF').length;
      
      let totalCatQuestions = 0;
      let numParts = 1;

      if (cat === 'MATEMATIKA') {
        totalCatQuestions = countMTK;
        numParts = Math.max(1, Math.ceil(countMTK / 30));
      } else if (cat === 'IPA') {
        totalCatQuestions = countIPA;
        numParts = Math.max(1, Math.ceil(countIPA / 30));
      } else if (cat === 'IPS') {
        totalCatQuestions = countIPS;
        numParts = Math.max(1, Math.ceil(countIPS / 30));
      } else {
        totalCatQuestions = all.length;
        numParts = Math.max(1, Math.ceil(all.length / 30));
      }

      const parts = [];
      for (let i = 1; i <= numParts; i++) {
        const startNum = (i - 1) * 30 + 1;
        let endNum = i * 30;
        if (cat !== 'CAMPURAN' && endNum > totalCatQuestions) endNum = totalCatQuestions;
        if (cat === 'CAMPURAN' && endNum > all.length) endNum = all.length;
        const qCount = Math.max(1, endNum - startNum + 1);
        parts.push({
          part: i,
          start: startNum,
          end: endNum,
          count: qCount
        });
      }

      // Deteksi bagian yang sudah selesai dikerjakan dari sesi
      const allSessions = (S.reviewsList && S.reviewsList.length > 0) ? S.reviewsList : JSON.parse(localStorage.getItem('cc_sessions_list') || '[]').filter(s => s.finished);
      const completedMap = new Map();
      allSessions.forEach(s => {
        if (s.finished) {
          const match = (s.teamName || s.team || '').match(new RegExp(`${cat} - Bagian (\\d+)`, 'i'));
          if (match) {
            const partNum = Number(match[1]);
            const prev = completedMap.get(partNum);
            const score = s.score !== undefined ? s.score : (s.review?.score || 0);
            const max = s.maximum !== undefined ? s.maximum : (s.review?.maximum || 30);
            const pct = Math.round((100 * score) / Math.max(1, max));
            if (!prev || pct > prev.pct) {
              completedMap.set(partNum, { score, max, pct, finishedAt: s.finishedAt || s.finished });
            }
          }
        }
      });

      const completedCount = parts.filter(p => completedMap.has(p.part)).length;
      const totalParts = parts.length;
      const progressPct = totalParts ? Math.round((completedCount / totalParts) * 100) : 0;

      return `
        ${heading('Latihan Mandiri Terpadu per Bagian (Paket)', 'Pilih mata pelajaran atau paket campuran, tentukan nomor bagian latihan (30 soal • 45 menit / alokasi 90 detik per soal), dan latih ketangkasanmu.')}

          </div>
          <div style="max-width:440px;margin-bottom:18px">
            <input type="text" id="trainStudentName" 
              placeholder="Ketik nama lengkap siswa (Contoh: Budi Santoso)..." 
              value="${esc(S.studentName || localStorage.getItem('cc_student_name') || '')}" 
              oninput="S.studentName = this.value; localStorage.setItem('cc_student_name', this.value);"
              style="width:100%;padding:10px 14px;border:2px solid #3b82f6;border-radius:8px;font-size:14.5px;font-weight:700;color:#0f172a;background:#fff;outline:none"
            >
            <div style="font-size:11.5px;color:#64748b;margin-top:6px">
              📌 <i>Nama ini akan tersimpan permanen di Supabase Cloud serta tampil di Lembar Pembahasan dan Evaluasi Guru.</i>
            </div>
          </div>

          <div style="font-size:12.5px;font-weight:800;color:#64748b;margin-bottom:8px">2. PILIH MATA PELAJARAN / PAKET:</div>
          <div class="part-category-bar">
            <a href="#/latihan/campuran" class="part-category-btn ${cat === 'CAMPURAN' ? 'active' : ''}" data-action="setPracticeCategory" data-val="CAMPURAN" style="text-decoration:none">
              🔀 Campuran MIPAS (10 MTK + 10 IPA + 10 IPS)
            </a>
            <a href="#/latihan/matematika" class="part-category-btn ${cat === 'MATEMATIKA' ? 'active' : ''}" data-action="setPracticeCategory" data-val="MATEMATIKA" style="text-decoration:none">
              🔢 Matematika (${countMTK} Soal)
            </a>
            <a href="#/latihan/ipa" class="part-category-btn ${cat === 'IPA' ? 'active' : ''}" data-action="setPracticeCategory" data-val="IPA" style="text-decoration:none">
              🔬 IPA (${countIPA} Soal)
            </a>
            <a href="#/latihan/ips" class="part-category-btn ${cat === 'IPS' ? 'active' : ''}" data-action="setPracticeCategory" data-val="IPS" style="text-decoration:none">

            </a>

          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">

            ⏱️ <b>Format Resmi Latihan:</b> Setiap bagian terdiri dari <b>30 Soal</b> dengan alokasi waktu <b>45 Menit</b> (90 detik per soal).<br>
            ⚡ <b>Alur Pengerjaan:</b> Pastikan nama siswa terisi di atas, lalu klik salah satu bagian latihan di bawah. Pilihan jawaban langsung lanjut ke nomor berikutnya dan otomatis dikumpulkan seketika di nomor terakhir.
          </div>
        </div>

        <div style="background:#fff;border:1.5px solid #cbd5e1;padding:12px 18px;border-radius:10px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">

            <div style="font-size:13.5px;font-weight:800;color:#1e293b">
              📊 Kemajuan Latihan ${cat}: <b>${completedCount}</b> dari <b>${totalParts} Bagian Selesai</b> (${progressPct}%)
            </div>
            <div style="font-size:12px;color:#64748b;margin-top:2px">
              ${completedCount === totalParts ? '🎉 Hebat sekali! Semua bagian latihan pada kategori ini sudah berhasil kamu selesaikan!' : 'Bagian yang sudah selesai ditandai dengan lencana hijau dan nilai terbaikmu.'}
            </div>
          </div>
          <div style="min-width:180px;height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden">

    // =========================================================================
    // VIEW: REVIEW HASIL BELAJAR & RIWAYAT SESI MURID [BARU]
    // =========================================================================
    function reviewsView() {
      const sessions = (S.reviewsList && S.reviewsList.length > 0) ? S.reviewsList : JSON.parse(localStorage.getItem('cc_sessions_list') || '[]').filter(s => s.finished);
      const filter = S.reviewsFilter || 'ALL';
      
      let filtered = sessions;
      if (filter === 'LATIHAN') {
        filtered = filtered.filter(s => (s.mode?.includes('LATIHAN') || s.mode === 'LATIHAN_BAGIAN') && !s.mode?.includes('REMEDIAL'));
      } else if (filter === 'EXAM') {
        filtered = filtered.filter(s => s.mode === 'PENYISIHAN' || s.mode === 'SEMIFINAL');
      } else if (filter === 'REMEDIAL') {
        filtered = filtered.filter(s => s.mode?.includes('REMEDIAL'));
      }

      const totalSesi = sessions.length;
      const avgPct = totalSesi > 0 
        ? Math.round(sessions.reduce((acc, s) => acc + (s.score && s.maximum ? (100 * s.score / s.maximum) : 0), 0) / totalSesi)
        : 0;

      return `
        ${heading('Review Hasil Latihan & Simulasi Lomba', 'Akses kembali hasil latihan mandiri dan simulasi lomba dari seluruh murid, pelajari penjelasan soal yang salah, dan latih ulang soal-soal yang belum tepat.')}
        
        <div class="grid cols-3" style="margin-bottom:20px">
          ${card(`<div class="stat"><div class="stat-icon">📋</div><div><small>Total Sesi Diselesaikan</small><strong>${totalSesi} Sesi</strong></div></div>`)}
          ${card(`<div class="stat"><div class="stat-icon">🎯</div><div><small>Rata-rata Ketepatan</small><strong>${avgPct}%</strong></div></div>`)}
          ${card(`<div class="stat"><div class="stat-icon">🔄</div><div><small>Fasilitas Remedial</small><strong style="color:#dc2626">Latih Ulang Soal Salah</strong></div></div>`)}
        </div>

        <div class="card" style="margin-bottom:20px">
          <div class="btn-row" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <span class="subtle" style="display:flex;align-items:center">
              ${S.supabaseConnected ? '🟢 <b>Tersinkronisasi dengan Supabase Cloud</b> (Murid &amp; Guru)' : '🟡 <b>Mode Mandiri / Lokal</b> (Hubungkan ke Supabase di menu Pengaturan agar tersimpan ke cloud)'}
            </span>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn ghost sm" data-action="reloadReviews">🔄 Segarkan Data Cloud</button>
              <button class="btn secondary sm" data-action="syncLocalSessions">☁️ Sinkronkan Sesi Lokal ke Supabase</button>
            </div>
          </div>
          <div class="summary-filter-bar">
            <div class="filter-pills">
              <span class="subtle" style="display:flex;align-items:center;margin-right:4px"><b>Filter Sesi:</b></span>
              <button class="filter-btn ${filter === 'ALL' ? 'active' : ''}" data-action="setReviewsFilter" data-val="ALL">Semua Sesi (${sessions.length})</button>
              <button class="filter-btn ${filter === 'LATIHAN' ? 'active' : ''}" data-action="setReviewsFilter" data-val="LATIHAN">🧠 Latihan Mandiri</button>
              <button class="filter-btn ${filter === 'EXAM' ? 'active' : ''}" data-action="setReviewsFilter" data-val="EXAM">🏆 Simulasi Lomba</button>
              <button class="filter-btn ${filter === 'REMEDIAL' ? 'active' : ''}" data-action="setReviewsFilter" data-val="REMEDIAL">🔄 Remedial Soal Salah</button>
            </div>
          </div>
        </div>

        ${filtered.length === 0 ? `
          <div class="card empty">
            <div style="font-size:44px">📝</div>
            <strong>Belum Ada Riwayat Sesi</strong>
            <p>Belum ada sesi latihan atau simulasi lomba yang tersimpan pada kategori ini. Yuk mulai latihan sekarang!</p>
            <div class="btn-row" style="justify-content:center;margin-top:10px">
              <button class="btn gold sm" data-action="navigate" data-page="practice">▶ Buka Latihan Mandiri</button>
              <button class="btn ghost sm" data-action="reloadReviews">🔄 Periksa Data Cloud</button>
            </div>
          </div>
        ` : `
          <div class="reviews-list">
            ${filtered.map(s => {
              const rev = s.review;
              const score = s.score !== undefined ? s.score : (rev?.score || 0);
              const max = s.maximum !== undefined ? s.maximum : (rev?.maximum || 1);
              const pct = Math.round((100 * score) / Math.max(1, max));
              const totalQ = rev?.total || (s.soalIds?.length || 0);
              const wrongCount = rev ? rev.items.filter(x => !x.correct).length : (totalQ - (rev?.correct || 0));
              const dateStr = s.finishedAt ? new Date(s.finishedAt).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
              const isRemedial = s.mode?.includes('REMEDIAL');
              const isCloud = s.source === 'cloud';

              return `
                <div class="review-history-card">
                  <div class="review-history-meta">
                    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                      <span class="pill ${isRemedial ? 'red' : (s.mode?.includes('EXAM') || s.mode === 'PENYISIHAN' || s.mode === 'SEMIFINAL' ? 'gold' : 'blue')}">
                        ${isRemedial ? '🔄 Remedial' : (s.mode?.includes('PENYISIHAN') ? '🏆 Penyisihan' : (s.mode?.includes('SEMIFINAL') ? '🏆 Semifinal' : '🧠 Latihan'))}

                      <span class="pill ${isCloud ? 'green' : 'gray'}" style="font-size:11px">
                        ${isCloud ? '☁️ Cloud' : '💾 Lokal'}
                      </span>
                      <span class="review-history-title" style="font-size:15px;font-weight:800;color:#0f172a">
                        👤 ${esc(s.teamName || s.team || s.studentName || 'Murid Hebat')}
                      </span>
                    </div>
                    <div class="review-history-sub">
                      <span>📅 ${dateStr}</span>
                      <span>•</span>
                      <span>⏱ ${Math.round(s.duration ? s.duration / 60 : 0)} menit pengerjaan</span>
                      <span>•</span>
                      <span>📝 ${totalQ} Soal (${rev ? rev.correct : score} Benar, <b style="color:${wrongCount > 0 ? '#dc2626' : '#16a34a'}">${wrongCount} Salah</b>)</span>
                    </div>
                  </div>

                  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
                    <div class="review-history-score">
                      <div style="font-size:12px;color:#64748b">Ketepatan:</div>
                      <strong style="color:${pct >= 75 ? '#16a34a' : (pct >= 50 ? '#d97706' : '#dc2626')}">${pct}%</strong>
                      <div style="font-size:11.5px;color:#94a3b8">${score} / ${max} Poin</div>
                    </div>

                    <div style="display:flex;gap:6px;flex-direction:column">
                      <button class="btn secondary sm" data-action="openReviewSession" data-id="${s.id}">
                        👁️ Buka Pembahasan &amp; Jawaban
                      </button>
                      ${wrongCount > 0 ? `
                        <button class="btn sm" data-action="retakeWrongFromHistory" data-id="${s.id}" style="background:#dc2626;color:#fff;border-color:#b91c1c;font-size:11px;padding:4px 8px">
                          🔄 Latih Lagi ${wrongCount} Soal Salah
                        </button>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function quizView() {
      const session = S.session;
      if (!session) return dashboardView();
      const qs = session.questions, idx = S.questionIndex, q = qs[idx];
      const count = Object.keys(S.answers).filter(k => S.answers[k]).length;
      const fraction = Math.round((count / qs.length) * 100);
      const deadline = Number(session.deadline);

      return `
        <div class="quiz-top">
          <div>
            <div class="pill blue">${esc(session.mode)} • ${esc(session.teamName)}</div>
            <h2 style="margin:8px 0 0">Soal Nomor ${idx + 1} dari ${qs.length}</h2>
          </div>
          <div class="timer" id="quizTimer">${deadline ? '--:--' : '⏱ Tanpa Batas'}</div>
        </div>
        <div class="progress"><div style="width:${fraction}%"></div></div>

        <div class="quiz-layout">
          <div>
            ${card(`
              <div class="question-actions">
                <span class="pill ${q.mapel === 'MATEMATIKA' ? 'blue' : (q.mapel === 'IPA' ? 'green' : 'gold')}">${esc(q.mapel)} • Kelas ${q.kelas}</span>
                <span class="subtle">${esc(q.topik)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#0284c7;background:#f0f9ff;border:1px solid #bae6fd;padding:6px 12px;border-radius:8px;margin-bottom:12px">
                <span>⚡ <b>Pengerjaan Cepat:</b> Klik jawaban otomatis lanjut ke nomor berikutnya &amp; langsung dikumpulkan di nomor terakhir.</span>
              </div>
              <div class="question-text">${formatQuestionText(q.text, q.svgStimulus)}</div>
              ${q.options.map((opt, i) => {
                const letter = 'ABCD'[i];
                return `
                  <button class="option ${S.answers[q.id] === letter ? 'selected' : ''}" data-action="answer" data-key="${letter}">
                    <span class="option-letter">${letter}</span>
                    <span>${esc(opt)}</span>
                  </button>
                `;
              }).join('')}
              <div class="question-control">
                <button class="btn secondary" data-action="previous" ${idx === 0 ? 'disabled' : ''}>← Sebelumnya</button>
                ${idx < qs.length - 1
                  ? `<button class="btn" data-action="next">Berikutnya →</button>`
                  : `<button class="btn good" data-action="submitQuiz">Kumpulkan Jawaban ✓</button>`}
              </div>
            `)}
          </div>
          <div>
            ${card(`
              <h3 style="margin:0 0 4px">Navigasi Lembar Soal</h3>
              <p class="subtle">${count} dari ${qs.length} soal sudah dijawab</p>
              <div class="number-grid">
                ${qs.map((item, i) => `
                  <button data-action="jump" data-index="${i}" class="${i === idx ? 'current' : (S.answers[item.id] ? 'done' : '')}">
                    ${i + 1}
                  </button>
                `).join('')}
              </div>
              <hr class="separator">
              <button class="btn good full" data-action="submitQuiz">✓ Kumpulkan Sekarang</button>
            `)}
          </div>
        </div>
      `;
    }

      return `
        ${card(`
          <div style="text-align:center;padding:10px 0">
            <div style="font-size:52px">${pct >= 80 ? '🏆' : (pct >= 60 ? '🌟' : '📚')}</div>

            <div style="margin:10px auto 14px;padding:10px 20px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;max-width:480px;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.04)">
              <div style="font-size:11.5px;color:#64748b;font-weight:800;letter-spacing:0.5px">NAMA SISWA / PESERTA:</div>

              <button class="btn ${S.reviewOnlyWrong ? 'gold' : 'secondary'}" data-action="toggleWrong">

              </button>
              ${wrongCount > 0 ? `
                <button class="btn danger" data-action="retakeWrongQuestions" style="background:#dc2626;color:#fff;font-weight:bold;box-shadow:0 3px 10px rgba(220,38,38,.3)">
                  🔄 Latih Lagi ${wrongCount} Soal yang Salah
                </button>
              ` : ''}
              <button class="btn ghost" data-action="print">🖨️ Cetak Lembar Hasil</button>
            </div>
          </div>
        `)}
        
        ${heading(
          S.reviewOnlyWrong ? 'Daftar Evaluasi Khusus Soal yang Salah' : 'Kunci Jawaban & Pembahasan Lengkap',
          S.reviewOnlyWrong ? 'Fokus pelajari diagnosa kesalahan dan langkah penyelesaian untuk soal yang belum tepat.' : 'Pelajari pembahasan materi untuk setiap soal guna memperkuat penguasaan konsep.'
        )}

        ${entries.map(q => {
          const chosenIdx = 'ABCD'.indexOf(q.chosen);

            <div class="result-answer ${q.correct ? 'correct' : 'wrong'}">

                <div>
                  <span class="pill ${q.mapel === 'MATEMATIKA' ? 'blue' : 'green'}">${esc(q.mapel)} • Kelas ${q.kelas}</span>
                  <span class="subtle" style="margin-left:6px"><b>Topik:</b> ${esc(q.topik)}</span>
                </div>

              ${formatQuestionText(q.text, q.svgStimulus)}

              <div class="result-comparison" style="margin:12px 0;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;font-size:13px">
                <div style="display:flex;flex-wrap:wrap;gap:18px">
                  <div>
                    <span style="color:#64748b">Jawaban Kamu:</span> 
                    <b style="color:${q.correct ? '#16a34a' : '#dc2626'}">${q.chosen ? esc(q.chosen + ' — ' + chosenText) : '<span style="color:#94a3b8">(Tidak dijawab)</span>'}</b>

                  <div>
                    <span style="color:#64748b">Kunci Jawaban yang Benar:</span>

                <div class="correct-explanation-box">
                  💡 <b>Pembahasan:</b> ${esc(q.explanation || 'Jawaban kamu tepat sekali!')}
                </div>
              `}
            </div>
          `;
        }).join('') || card('<div class="empty">Hebat sekali! Tidak ada jawaban yang salah 🎉</div>')}
      `;
    }

    // =========================================================================
    // =========================================================================
    // RENDER UTAMA & EVENT ROUTING (SPA HASH & DIRECT URL)
    // =========================================================================
    const PAGE_TO_ROUTE = {
      dashboard: 'dasbord',
      summary: 'rangkuman',
      practice: 'latihan',
      reviews: 'reviewjawaban',
      exam: 'simulasi',
      quiz: 'quiz',
      result: 'hasil',
      final: 'final',
      bank: 'banksoal',
      stats: 'evaluasi',
      settings: 'pengaturan'
    };

    const ROUTE_TO_PAGE = {
      dasbord: 'dashboard',
      dashboard: 'dashboard',
      beranda: 'dashboard',
      rangkuman: 'summary',
      materi: 'summary',
      summary: 'summary',
      latihan: 'practice',
      latihanmandiri: 'practice',
      practice: 'practice',
      reviewjawaban: 'reviews',
      review: 'reviews',
      reviews: 'reviews',
      riwayat: 'reviews',
      simulasi: 'exam',
      lomba: 'exam',
      exam: 'exam',
      quiz: 'quiz',
      pengerjaan: 'quiz',
      soal: 'quiz',
      hasil: 'result',
      result: 'result',
      final: 'final',
      buzzer: 'final',
      banksoal: 'bank',
      bank: 'bank',
      evaluasi: 'stats',
      statistik: 'stats',
      stats: 'stats',
      pengaturan: 'settings',
      settings: 'settings'
    };

    let isNavigatingFromUrl = false;

    function getRouteInfo() {
      let path = (window.location.hash || '').replace(/^#\/?/, '').trim();
      if (!path) {
        const pName = (window.location.pathname || '').replace(/^\/+/, '').trim();
        if (pName && !pName.endsWith('.html') && !pName.endsWith('.js') && !pName.endsWith('.json')) {
          path = pName;
        }
      }
      const parts = path.split('/').filter(Boolean).map(s => decodeURIComponent(s).toLowerCase());
      const main = parts[0] || 'dasbord';
      const sub = parts[1] || '';
      return { main, sub, parts };
    }

    function syncUrl() {
      if (isNavigatingFromUrl) return;
      const pageRoute = PAGE_TO_ROUTE[S.page] || S.page;
      let targetHash = '#/' + pageRoute;
      if (S.page === 'practice' && S.practiceCategory) {
        targetHash += '/' + S.practiceCategory.toLowerCase();
      } else if (S.page === 'summary' && S.summaryFilter?.mapel) {
        targetHash += '/' + S.summaryFilter.mapel.toLowerCase();
      }
      if (window.location.hash !== targetHash) {
        try {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', targetHash);
          } else {
            window.location.hash = targetHash;
          }
        } catch (e) {
          window.location.hash = targetHash;
        }
      }
    }

    async function handleRoute() {
      const { main, sub } = getRouteInfo();
      const page = ROUTE_TO_PAGE[main] || 'dashboard';

      isNavigatingFromUrl = true;
      S.page = page;

      if (page === 'practice') {
        if (sub === 'matematika') S.practiceCategory = 'MATEMATIKA';
        else if (sub === 'ipa') S.practiceCategory = 'IPA';
        else if (sub === 'ips') S.practiceCategory = 'IPS';
        else if (sub === 'campuran') S.practiceCategory = 'CAMPURAN';
      } else if (page === 'summary') {
        if (sub === 'matematika') S.summaryFilter.mapel = 'MATEMATIKA';
        else if (sub === 'ipa') S.summaryFilter.mapel = 'IPA';
        else if (sub === 'ips') S.summaryFilter.mapel = 'IPS';
        else if (sub === 'semua' || !sub) S.summaryFilter.mapel = '';
      }

      render();

      if (page === 'bank' && S.token) {
        try { await reloadBank(); } catch (e) {}
      }
      if (page === 'stats' && S.token) {
        try { await reloadStats(); } catch (e) {}
      }
      if (page === 'reviews') {
        try { await reloadReviews(); } catch (e) {}
      }

      syncUrl();
