    function render() {
      let html = '';
      if (S.page === 'dashboard') html = dashboardView();
      else if (S.page === 'summary') html = summaryView();
      else if (S.page === 'practice') html = practiceView();
      else if (S.page === 'reviews') html = reviewsView();
      else if (S.page === 'exam') html = examView();
      else if (S.page === 'quiz') html = quizView();
      else if (S.page === 'result') html = resultView();
      else if (S.page === 'final') html = finalView();
      else if (S.page === 'bank') html = bankView();
      else if (S.page === 'stats') html = statsView();
      else if (S.page === 'settings') html = settingsView();

    function updateClocks() {
      if (S.page === 'quiz' && S.session?.deadline) {
        const left = Math.ceil((S.session.deadline - Date.now()) / 1000);
        const el = $('#quizTimer');
        if (el) {
          el.textContent = clock(left);
          el.classList.toggle('urgent', left <= 60);
        }
        if (left <= 0 && !S.busy && !S.submitting) {
          submitQuiz(true);
        }
      }
      if (S.page === 'final' && S.finalDeadline && S.final?.phase !== 'SELESAI') {
        const left = Math.ceil((S.finalDeadline - Date.now()) / 1000);
        const el = $('#finalTimer');
        if (el) {
          el.textContent = clock(left);
          el.classList.toggle('urgent', left <= 10);
        }
        if (left <= 0 && !S.finalExpired) {
          S.finalExpired = true;
          S.finalDeadline = null;
          toast('Waktu menjawab habis.');
          const team = S.final.mandatoryTeam !== null ? S.final.mandatoryTeam : (S.buzzTeam !== null ? S.buzzTeam : 0);
          judgeFinal(team, 'KOSONG');
        }
      }
    }

    async function syncLocalSessionsToCloud() {
      if (!S.supabaseConnected || !S.supabase) {
        toast('Supabase Cloud belum terhubung. Sambungkan di menu Pengaturan terlebih dahulu.', true);
        return;
      }
      const localList = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]').filter(s => s.finished);
      if (localList.length === 0) {
        toast('Tidak ada riwayat sesi lokal yang perlu disinkronkan.');
        return;
      }
      busy(true);
      try {
        let savedCount = 0;
        for (const s of localList) {
          const res = await dbSaveSession(s);
          if (res.cloudSaved) savedCount++;
        }
        await reloadReviews();
        toast(`✅ Berhasil menyinkronkan ${savedCount} dari ${localList.length} sesi ke Cloud Supabase!`);
      } catch (err) {
        toast('Gagal sinkronisasi: ' + (err.message || String(err)), true);
      } finally {
        busy(false);
      }
    }

      if (S.submitting || !S.session) return;

    function csvDownload(filename, rows) {
      const escape = v => {
        const s = String(v ?? '');
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const body = '\ufeff' + rows.map(r => r.map(escape).join(',')).join('\r\n');
      const blob = new Blob([body], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

          render();
          break;

          S.reviewsFilter = el.dataset.val;

          break;

            if (inputEl) {
              inputEl.focus();
              inputEl.style.borderColor = '#dc2626';
              inputEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            return;
          }

          // Simpan permanen ke state dan localStorage
          S.studentName = rawName;
          localStorage.setItem('cc_student_name', rawName);

          const part = Number(el.dataset.part) || 1;
          const cat = S.practiceCategory || 'CAMPURAN';
          const sort = S.practiceSort || 'ACAK';
          const fullSessionName = `${rawName} (${cat} - Bagian ${part})`;
          
          const sess = await run(() => api.createSession({
            mode: 'LATIHAN_BAGIAN',

            part,
            sort,
            teamName: fullSessionName,

          S.questionIndex = 0;
          S.answers = {};
          S.page = 'quiz';
          sessionStorage.setItem('ccActiveSession', sess.id);
          render();
          break;
        }

        case 'reloadReviews':
          await reloadReviews();
          toast('Data sesi cloud berhasil dimuat ulang! 🔄');
          break;

        case 'syncLocalSessions':
          await syncLocalSessionsToCloud();
          break;

        case 'openReviewSession': {
          const id = el.dataset.id;
          let sess = (S.reviewsList || []).find(s => s.id === id);
          if (!sess) {
            const list = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]');
            sess = list.find(s => s.id === id);
          }
          if (!sess && S.supabaseConnected && S.supabase) {
            try {
              const { data, error } = await S.supabase.from('cc_sessions').select('*').eq('id', id).maybeSingle();
              if (data && !error) {
                sess = {
                  id: data.id,
                  teamName: data.nama_tim,
                  team: data.nama_tim,
                  studentName: (data.nama_tim || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || data.nama_tim,
                  mode: data.mode,
                  score: Number(data.skor) || 0,
                  maximum: Number(data.maks_skor) || 0,
                  finishedAt: Number(data.selesai_ms) || Date.now(),
                  startedAt: Number(data.mulai_ms) || 0,
                  answers: data.jawaban || {},
                  soalIds: data.soal_ids || [],
                  source: 'cloud'
                };
              }
            } catch (err) {
              console.warn('Gagal ambil detail sesi dari Supabase:', err);
            }
          }
          if (!sess) { toast('Data sesi tidak ditemukan.', true); return; }
          
          const sName = sess.studentName || (sess.teamName || sess.team || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || 'Murid';
          const tName = sess.teamName || sess.team || sName;

          if (!sess.review) {
            const allQuestions = await dbGetQuestions();
            const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
            const items = (sess.questions || sess.soalIds || []).map(qOrId => {
              const qId = typeof qOrId === 'string' ? qOrId : qOrId.id;
              const raw = qMap.get(qId);
              const chosen = sess.answers?.[qId] || '';
              const correct = chosen && raw && chosen.toUpperCase() === raw.KUNCI.trim().toUpperCase();
              return {
                ...(typeof qOrId === 'object' ? qOrId : publicQuestion(raw)),
                chosen,
                correct: !!correct,
                answer: raw ? raw.KUNCI : '',
                explanation: raw ? raw.PEMBAHASAN : '',
                diagnosa: raw ? raw.DIAGNOSA : '',
                points: correct ? 4 : 0
              };
            });
            sess.review = {
              teamName: tName,
              studentName: sName,
              mode: sess.mode,
              score: sess.score !== undefined ? sess.score : items.reduce((s, it) => s + it.points, 0),
              maximum: sess.maximum || (items.length * 4),
              correct: items.filter(x => x.correct).length,
              total: items.length,
              items,
              finishedAt: sess.finishedAt || Date.now()
            };
          } else {
            sess.review.teamName = sess.review.teamName || tName;
            sess.review.studentName = sess.review.studentName || sName;
            sess.review.mode = sess.review.mode || sess.mode;
          }
          S.review = sess.review;
          S.reviewOnlyWrong = false;
          S.page = 'result';
          render();
          break;
        }

        case 'retakeWrongQuestions': {
          if (!S.review?.items) return;
          const wrongItems = S.review.items.filter(x => !x.correct);
          if (wrongItems.length === 0) {
            toast('Tidak ada soal yang salah! Semua jawaban kamu sudah tepat 🎉');
            return;
          }
          const allQuestions = await dbGetQuestions();
          const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
          const selected = wrongItems.map(w => qMap.get(w.id)).filter(Boolean);
          
          const sess = await run(() => api.createSession({
            mode: 'REMEDIAL',
            teamName: 'Remedial ' + selected.length + ' Soal Salah',

          break;

        case 'retakeWrongFromHistory': {

          const sess = (S.reviewsList || []).find(s => s.id === id) || (JSON.parse(localStorage.getItem('cc_sessions_list') || '[]')).find(s => s.id === id);
          if (!sess) return;
          
          let wrongItems = [];
          if (sess.review?.items) {
            wrongItems = sess.review.items.filter(x => !x.correct);
          } else {
            const allQuestions = await dbGetQuestions();
            const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
            wrongItems = (sess.soalIds || []).map(qId => {
              const raw = qMap.get(qId);
              const chosen = sess.answers?.[qId] || '';
              const correct = chosen && raw && chosen.toUpperCase() === raw.KUNCI.trim().toUpperCase();
              return correct ? null : { id: qId };
            }).filter(Boolean);
          }

          if (wrongItems.length === 0) {
            toast('Tidak ada soal yang salah pada sesi ini! 🎉');
            return;
          }

          const allQuestions = await dbGetQuestions();
          const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
          const selected = wrongItems.map(w => qMap.get(w.id)).filter(Boolean);

          const newSess = await run(() => api.createSession({
            mode: 'REMEDIAL',
            teamName: `Remedial ${selected.length} Soal (${sess.teamName || 'Murid'})`,

          S.questionIndex = 0;
          S.answers = {};
          S.page = 'quiz';
          sessionStorage.setItem('ccActiveSession', newSess.id);
          toast(`Memulai latihan remedial ${selected.length} soal salah. Waktu: 90 dtk/soal. Semangat! 💪`);

        case 'startPractice': {
          const mode = value('trainMode');
          const name = (value('trainTeamName') || 'Siswa Mandiri').trim();
          const sess = await run(() => api.createSession({
            mode,
            teamName: name,
            mapel: value('trainMapel'),
            kelas: value('trainKelas'),

          S.answers = {};

        case 'answer': {
          if (!S.session || S.submitting) return;
          const q = S.session.questions[S.questionIndex];
          S.answers[q.id] = el.dataset.key;
          api.saveAnswers(S.session.id, S.answers).catch(() => {});
          render();

          const totalQ = S.session.questions.length;
          const isLast = S.questionIndex === totalQ - 1;

          if (isLast) {
            // Soal nomor terakhir langsung otomatis dikumpulkan seketika
            if (S.autoSubmitTimer) clearTimeout(S.autoSubmitTimer);
            if (S.autoAdvanceTimer) clearTimeout(S.autoAdvanceTimer);
            toast('🏁 Soal terakhir terjawab. Mengumpulkan jawaban otomatis...');
            S.autoSubmitTimer = setTimeout(async () => {
              if (S.session && !S.submitting) {
                await submitQuiz(true);
              }
            }, 350);
          } else {
            // Otomatis pindah ke nomor berikutnya
            if (S.autoAdvanceTimer) clearTimeout(S.autoAdvanceTimer);
            S.autoAdvanceTimer = setTimeout(() => {
              if (S.session && S.page === 'quiz' && S.questionIndex < totalQ - 1) {
                S.questionIndex++;
                render();
              }
            }, 260);
          }
          break;
        }

        case 'previous':

          if (S.autoSubmitTimer) clearTimeout(S.autoSubmitTimer);
          S.questionIndex = Math.max(0, S.questionIndex - 1);

          if (S.autoSubmitTimer) clearTimeout(S.autoSubmitTimer);

        case 'downloadSupabaseConfig': {

          const key = (value('cfgSupabaseKey') || S.supabaseKey).trim();
          const content = `// supabase_config.js - Konfigurasi Terpusat Supabase Cloud\n// File ini membuat SELURUH murid dan guru otomatis terhubung ke Supabase saat membuka web.\nwindow.CC_SUPABASE_CONFIG = {\n  URL: "${url}",\n  ANON_KEY: "${key}"\n};\n`;
          const blob = new Blob([content], { type: 'text/javascript' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'supabase_config.js';
          a.click();
          toast('File supabase_config.js berhasil diunduh! 📄');

        case 'syncSeedToCloud': {
          if (!S.supabaseConnected || !S.supabase) {
            toast('Hubungkan Supabase terlebih dahulu sebelum sinkronisasi.', true);
            return;
          }
          const questions = typeof QUESTIONS_SEED !== 'undefined' ? QUESTIONS_SEED : [];
          if (!confirm(`Unggah seluruh ${questions.length} bank soal ke Supabase database?`)) return;
          await run(async () => {
            const batchSize = 50;
            for (let i = 0; i < questions.length; i += batchSize) {
              const batch = questions.slice(i, i + batchSize).map(q => ({
                id: q.ID_SOAL,
                mapel: q.MAPEL,
                kelas: q.KELAS,
                topik: q.TOPIK,
                babak: q.BABAK,
                level: q.LEVEL,
                tipe: q.TIPE,
                pertanyaan: q.PERTANYAAN,
                opsi_a: q.OPSI_A,
                opsi_b: q.OPSI_B,
                opsi_c: q.OPSI_C,
                opsi_d: q.OPSI_D,
                kunci: q.KUNCI,
                pembahasan: q.PEMBAHASAN,
                status: q.STATUS
              }));
              const { error } = await S.supabase.from('cc_questions').upsert(batch);
              if (error) throw new Error('Gagal sinkron batch ' + i + ': ' + error.message);
            }
          });
          toast(`Berhasil mengunggah ${questions.length} soal ke Supabase!`);
          S.boot = await api.getBootstrap();
          render();
          break;
        }

        case 'loadRanking': {
          const mode = el.dataset.mode;
          S.ranking = { mode, items: await run(() => api.leaderboard(S.token, mode)) };
          render();
          break;
        }

        case 'newFinal': {
          const names = [value('finalTeam1'), value('finalTeam2'), value('finalTeam3')].map(s => s.trim());
          if (names.some(n => !n)) { toast('Isi nama ketiga tim finalis.', true); return; }
          const res = await run(() => api.createFinalMatch(S.token, names));
          S.final = res;
          S.finalDeadline = null;
          S.finalExpired = false;
          S.buzzTeam = null;
          render();
          break;
        }

        case 'resumeFinal': {
          const res = await run(() => api.getFinalMatch(S.token, 'current'));
          S.final = res;
          render();
          break;
        }

        case 'startFinalTimer': {
          if (!S.finalDeadline && !S.finalExpired) {
            S.finalDeadline = Date.now() + ((S.final.phase === 'WAJIB' ? 30 : 180) * 1000);
            updateClocks();
            sound(740);
          }
          break;
        }

        case 'toggleFinalAnswer':
          S.showFinalAnswer = !S.showFinalAnswer;
          render();
          break;

        case 'judge':
          await judgeFinal(Number(el.dataset.team), el.dataset.result);
          break;

        case 'passFinal': {
          if (!confirm('Lempar soal ke tim lain setelah hening 3 detik?')) return;
          const team = Number(el.dataset.team);
          await judgeFinal(team, 'LEMPAR');
          break;
        }

        case 'finalExpire': {
          const team = S.final.mandatoryTeam !== null ? S.final.mandatoryTeam : (S.buzzTeam !== null ? S.buzzTeam : 0);
          await judgeFinal(team, 'KOSONG');
          break;
        }

        case 'resetFinal':
          S.final = null;
          render();
          break;

        case 'loadBank':
          await reloadBank();
          break;

        case 'newQuestion':
          S.editing = { mapel: 'MATEMATIKA', kelas: 4, babak: 'UMUM', level: 'SEDANG', tipe: 'PG', options: ['', '', '', ''], answer: 'A', active: true };
          render();
          break;

        case 'cancelEditor':
          S.editing = null;
          render();
          break;

        case 'editQuestion':
          S.editing = S.bank?.items?.find(q => q.id === el.dataset.id) || null;
          render();
          window.scrollTo({ top: 120, behavior: 'smooth' });
          break;

        case 'saveQuestion': {
          const q = {
            id: S.editing.id || '',
            mapel: value('qMapel'),
            kelas: Number(value('qKelas')),
            topik: value('qTopik'),
            babak: value('qBabak'),
            level: value('qLevel'),
            tipe: value('qTipe'),
            text: value('qText'),
            options: [value('qA'), value('qB'), value('qC'), value('qD')],
            answer: value('qAnswer'),
            explanation: value('qExplanation'),
            active: value('qActive') === 'true'
          };
          await run(() => api.saveQuestion(S.token, q));
          S.editing = null;
          toast('Soal berhasil disimpan.');
          await reloadBank();
          break;
        }

        case 'disableQuestion': {
          if (!confirm('Nonaktifkan soal ini?')) return;
          await run(() => api.disableQuestion(S.token, el.dataset.id));
          toast('Soal dinonaktifkan.');
          await reloadBank();
          break;
        }

        case 'applyBankFilter':
          S.bankFilter = { page: 0, search: value('filterSearch'), mapel: value('filterSubject'), kelas: value('filterGrade') };
          await reloadBank();
          break;

        case 'bankNext':
          S.bankFilter.page++;
          await reloadBank();
          break;

        case 'bankPrevious':
          S.bankFilter.page = Math.max(0, S.bankFilter.page - 1);
          await reloadBank();
          break;

        case 'importCsv':
          $('#csvFile').click();
          break;

        case 'templateCsv':
          csvDownload('template_soal_mipas.csv', [
            csvHead,
            ['', 'MATEMATIKA', '4', 'Pecahan', 'UMUM', 'SEDANG', 'PG', 'Berapa 1/2 + 1/2?', '1', '2', '1/2', '1/4', 'A', 'Penyebut sama, jumlahkan pembilang.', 'true']
          ]);
          break;

        case 'exportCsv': {
          const qs = await run(() => api.exportQuestions(S.token));
          const rows = [csvHead, ...qs.map(q => [q.ID_SOAL, q.MAPEL, q.KELAS, q.TOPIK, q.BABAK, q.LEVEL, q.TIPE, q.PERTANYAAN, q.OPSI_A, q.OPSI_B, q.OPSI_C, q.OPSI_D, q.KUNCI, q.PEMBAHASAN, q.STATUS === 'AKTIF'])];
          csvDownload('bank_soal_mipas.csv', rows);
          toast(`${qs.length} soal berhasil diekspor.`);
          break;
        }

        default:
          break;
      }
    }

    // Parser & Handler Impor CSV
    function parseCsv(text) {
      const rows = [];
      let row = [], field = '', quote = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quote) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') quote = false;
          else field += c;
        } else if (c === '"') quote = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          if (row.some(x => x.trim())) rows.push(row);
          row = []; field = '';
        } else field += c;
      }
      row.push(field);
      if (row.some(x => x.trim())) rows.push(row);
      if (quote) throw new Error('File CSV memiliki tanda petik yang tidak tertutup.');
      return rows;
    }

    async function handleCsvUpload(file) {
      if (!file) return;
      const text = await file.text();
      const rows = parseCsv(text.replace(/^\ufeff/, ''));
      if (!rows.length) throw new Error('File CSV kosong.');
      const headers = rows.shift().map(s => s.trim());
      const data = rows.map(row => {
        const o = {};
        headers.forEach((h, i) => o[h] = row[i] || '');
        return {
          id: o.id,
          mapel: o.mapel,
          kelas: o.kelas,
          topik: o.topik,
          babak: o.babak,
          level: o.level,
          tipe: o.tipe,
          text: o.text,
          options: [o.A, o.B, o.C, o.D],
          answer: o.answer,
          explanation: o.explanation,
          active: String(o.active).toLowerCase() !== 'false'
        };
      });
      const res = await run(() => api.importQuestions(S.token, data));
      toast(`Impor selesai: ${res.imported} soal berhasil ditambahkan (${res.skipped} dilewati).`);
      S.bankFilter.page = 0;
      await reloadBank();
    }

    // Event Listener Klik
    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-action]');
      if (!el || el.disabled || el.dataset.action === 'buzz') return;
      ev.preventDefault();
      handleAction(el.dataset.action, el).catch(err => toast(err.message || String(err), true));
    });

    // Event Listener Buzzer (Touch & Click cepat)
    document.addEventListener('pointerdown', ev => {
      const el = ev.target.closest('[data-action="buzz"]');
      if (!el || el.disabled || !S.final || S.final.phase === 'WAJIB' || S.buzzTeam !== null || S.finalExpired) return;
      const team = Number(el.dataset.team);
      if (!S.final.eligible.includes(team)) return;
      ev.preventDefault();
      S.buzzTeam = team;
      sound([520, 680, 840][team]);
      render();
    }, { passive: false });

    // Event Listener Pencarian Rangkuman
    document.addEventListener('input', ev => {
      if (ev.target.id === 'summarySearch') {
        S.summaryFilter.search = ev.target.value;
        const container = $('.summary-grid');
        const emptyEl = $('.card.empty');
        // Render cepat ulang hanya summary
        if (S.page === 'summary') {
          clearTimeout(window._searchTimer);
          window._searchTimer = setTimeout(render, 150);
        }
      }
    });

    // Event Listener Berkas CSV
    document.addEventListener('change', ev => {
      if (ev.target.id === 'csvFile' && ev.target.files?.[0]) {
        handleCsvUpload(ev.target.files[0]).catch(e => toast(e.message, true));
        ev.target.value = '';
      }
    });

    // Inisialisasi Aplikasi
    async function init() {
      try {
        if (S.supabaseUrl && S.supabaseKey) {
          await initSupabase(S.supabaseUrl, S.supabaseKey);
        }
        S.boot = await api.getBootstrap();
        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('popstate', handleRoute);
        await handleRoute();
        setInterval(updateClocks, 1000);
      } catch (e) {
        console.error('Inisialisasi aplikasi gagal:', e);
        $('#app').innerHTML = `
          <main style="max-width:640px;margin:12vh auto;padding:24px">
            <div class="card" style="text-align:center">
              <h2>⚠️ Gagal Memuat Aplikasi</h2>
              <p>${esc(e.message || String(e))}</p>
              <button class="btn" onclick="location.reload()">Muat Ulang</button>
            </div>
          </main>
        `;
      }
    }

    init();
  </script>
</body>
</html>
