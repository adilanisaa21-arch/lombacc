<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Arena Cerdas Cermat MIPAS 2026 - Latihan Olimpiade & ANBK SD Kelas 4, 5, 6 dengan Supabase dan Vercel">
  <title>Arena Cerdas Cermat MIPAS 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <style>
    :root{
      --navy:#0f172a;--royal:#2563eb;--royal-dark:#1d4ed8;--sky:#38bdf8;
      --violet:#7c3aed;--gold:#f59e0b;--gold-light:#fef3c7;--mint:#10b981;
      --mint-light:#d1fae5;--red:#ef4444;--red-light:#fee2e2;--ink:#1e293b;
      --muted:#64748b;--line:#e2e8f0;--canvas:#f8fafc;--card:#ffffff;
      --radius:18px;--shadow:0 10px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.04);
      --font-main:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;font-family:var(--font-main);background:var(--canvas);color:var(--ink);line-height:1.5}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    input:focus,select:focus,textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
    textarea{resize:vertical;min-height:84px}
    .hide{display:none!important}

    /* Shell Layout */
    .shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    .sidebar{background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
    .logo{display:flex;gap:12px;align-items:center;padding:8px 8px 24px}
    .logo-emblem{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#ea580c);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(245,158,11,.3);flex-shrink:0}
    .logo strong{font-size:15px;display:block;letter-spacing:.3px;font-weight:800}
    .logo small{display:block;color:#94a3b8;font-size:11px;margin-top:2px}
    .nav-caption{font-size:11px;color:#64748b;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 10px 6px}
    .nav-button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;margin:3px 0;transition:background .15s,color .15s}
    .nav-button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-button.active{background:rgba(37,99,235,.2);color:#60a5fa;box-shadow:inset 3px 0 #3b82f6}
    .nav-ico{font-size:19px;width:24px;text-align:center;flex-shrink:0}
    .side-foot{margin-top:auto;padding:16px 10px 4px;border-top:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:11px;line-height:1.6}
    .side-cloud-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:700;margin-top:8px}
    .side-cloud-badge.online{background:rgba(16,185,129,.15);color:#34d399}
    .side-cloud-badge.offline{background:rgba(245,158,11,.15);color:#fbbf24}

    /* Main Area */
    .main{min-width:0;display:flex;flex-direction:column}
    .topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px;position:sticky;top:0;z-index:40}
    .topbar-title{font-size:17px;font-weight:800;color:var(--navy)}
    .topbar-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .topbar-badges{display:flex;align-items:center;gap:10px}
    .badge{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;font-size:11.5px;font-weight:700}
    .badge.royal{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
    .badge.green{background:var(--mint-light);color:#065f46;border:1px solid #a7f3d0}
    .badge.gold{background:var(--gold-light);color:#92400e;border:1px solid #fde68a}
    .content{max-width:1400px;width:100%;margin:0 auto;padding:28px 32px 64px}

    /* Hero Banner */
    .hero{background:linear-gradient(130deg,#1e3a8a 0%,#2563eb 55%,#7c3aed 100%);color:#fff;border-radius:24px;padding:36px 40px;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(37,99,235,.25);display:flex;align-items:center;justify-content:space-between;gap:24px}
    .hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-80px;top:-160px;background:rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.04)}
    .hero h1{margin:6px 0 10px;font-size:clamp(24px,2.8vw,36px);line-height:1.2;font-weight:900;letter-spacing:-.5px}
    .hero p{font-size:14px;color:#e0e7ff;margin:0 0 18px;max-width:620px;line-height:1.6}
    .hero-art{font-size:86px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));z-index:1;user-select:none}
    .eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:800;color:#fcd34d}

    /* Typography & Layout Grids */
    .heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 16px}
    .heading h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy)}
    .heading p{font-size:12.5px;color:var(--muted);margin:3px 0 0}
    .grid{display:grid;gap:18px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid #e2e8f0;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-width:0}

    /* Stats & Mode Cards */
    .stat{display:flex;gap:16px;align-items:center}
    .stat-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#f1f5f9;flex-shrink:0}
    .stat small{color:var(--muted);font-size:12px;font-weight:600}
    .stat strong{font-size:26px;display:block;margin-top:2px;font-weight:800;color:var(--navy)}
    .mode-card{border:1px solid #e2e8f0;border-radius:20px;background:#fff;padding:22px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
    .mode-card:hover{transform:translateY(-2px);border-color:#cbd5e1}
    .mode-icon{width:52px;height:52px;border-radius:16px;background:#f8fafc;display:grid;place-items:center;font-size:26px;margin-bottom:14px;box-shadow:inset 0 0 0 1px #e2e8f0}
    .mode-card h3{margin:0 0 6px;font-size:16.5px;font-weight:800;color:var(--navy)}
    .mode-card p{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.5;flex:1}
    .mode-card button{width:100%}

    /* Buttons */
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:13px;background:var(--royal);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.2);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
    .btn:hover{filter:brightness(1.08)}
    .btn:active{transform:scale(.98)}
    .btn.secondary{color:var(--royal);background:#eff6ff;box-shadow:none;border:1px solid #bfdbfe}
    .btn.ghost{color:var(--ink);background:#f1f5f9;box-shadow:none;border:1px solid #e2e8f0}
    .btn.good{background:var(--mint);box-shadow:0 4px 10px rgba(16,185,129,.2)}
    .btn.danger{background:var(--red);box-shadow:0 4px 10px rgba(239,68,68,.2)}
    .btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 10px rgba(245,158,11,.2)}
    .btn.sm{padding:8px 13px;font-size:12px;border-radius:9px}
    .btn.full{width:100%}
    .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    /* Forms & Inputs */
    .field{min-width:0}
    .field label{font-size:12px;color:#475569;font-weight:700;display:block;margin-bottom:6px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    .separator{border:0;border-top:1px solid var(--line);margin:20px 0}
    .subtle{color:var(--muted);font-size:12.5px;line-height:1.55}

    /* Notices & Alerts */
    .notice{border-radius:14px;padding:14px 18px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.6;border:1px solid #bfdbfe}
    .notice.warning{background:#fffbeb;color:#92400e;border-color:#fde68a}
    .notice.success{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9;color:#334155}
    .pill.blue{background:#eff6ff;color:#1d4ed8}
    .pill.green{background:#ecfdf5;color:#047857}
    .pill.red{background:#fef2f2;color:#b91c1c}
    .pill.gold{background:#fffbeb;color:#b45309}
    .pill.purple{background:#f5f3ff;color:#6d28d9}

    /* Quiz Layout */
    .quiz-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .timer{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#eff6ff;border-radius:14px;color:#1e40af;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;border:1px solid #bfdbfe}
    .timer.urgent{background:#fef2f2;color:#b91c1c;border-color:#fecaca;animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.65}}
    .progress{height:8px;background:#e2e8f0;overflow:hidden;border-radius:100px;margin:16px 0 20px}
    .progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .2s}
    .question-text{font-size:clamp(19px,2vw,27px);font-weight:800;line-height:1.45;white-space:pre-wrap;margin:16px 0 24px;color:var(--navy)}
    .option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;padding:16px 18px;border-radius:14px;margin:10px 0;color:var(--ink);font-size:15.5px;line-height:1.4;transition:border-color .15s,background .15s}
    .option:hover{border-color:#93c5fd;background:#f8fafc}
    .option.selected{border-color:#2563eb;background:#eff6ff}
    .option-letter{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;background:#f1f5f9;border-radius:10px;font-weight:800;color:#475569}
    .option.selected .option-letter{background:#2563eb;color:#fff}
    .number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .number-grid button{padding:10px 0;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;font-weight:800;font-size:13px}
    .number-grid button.done{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
    .number-grid button.current{background:#2563eb;color:#fff;border-color:#1d4ed8}
    .quiz-layout{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(240px,1fr);gap:18px}
    .question-control{display:flex;justify-content:space-between;gap:10px;margin-top:24px}

    /* Result View */
    .result-score{font-size:clamp(48px,6vw,80px);font-weight:900;color:#2563eb;letter-spacing:-4px;margin:4px 0}
    .result-answer{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
    .result-answer.correct{border-left:5px solid var(--mint)}
    .result-answer.wrong{border-left:5px solid var(--red)}
    .result-answer strong{display:block;margin-bottom:5px;color:var(--navy)}
    .result-answer p{margin:6px 0;font-size:12.5px;line-height:1.6;color:#475569}

    /* Final & Buzzer */
    .final-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
    .team-score{background:#fff;border:2px solid #e2e8f0;border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow)}
    .team-score:nth-child(1){border-top:6px solid #ef4444}
    .team-score:nth-child(2){border-top:6px solid #3b82f6}
    .team-score:nth-child(3){border-top:6px solid #10b981}
    .team-score h3{font-size:15px;margin:0 0 8px}
    .team-score strong{font-size:clamp(32px,3.8vw,54px);font-variant-numeric:tabular-nums;display:block;color:var(--navy);font-weight:900}
    .team-score.active{box-shadow:0 0 0 4px rgba(245,158,11,.35)}
    .buzzer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
    .buzzer{border:0;border-radius:18px;padding:28px 10px;color:#fff;font-weight:900;font-size:clamp(15px,1.8vw,23px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),0 10px 20px rgba(0,0,0,.15);touch-action:manipulation;user-select:none}
    .buzzer:nth-child(1){background:#ef4444}
    .buzzer:nth-child(2){background:#2563eb}
    .buzzer:nth-child(3){background:#10b981}
    .buzzer.winner{outline:6px solid var(--gold);outline-offset:2px}
    .buzzer:disabled{filter:grayscale(.7);opacity:.45}
    .score-action{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
    .podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:24px 0}
    .podium .place{width:30%;text-align:center;background:#eff6ff;border-radius:16px 16px 0 0;padding:16px 6px}
    .podium .place:nth-child(1){height:140px;order:2;background:#fef3c7}
    .podium .place:nth-child(2){height:115px;order:1}
    .podium .place:nth-child(3){height:95px;order:3}
    .podium strong{display:block;font-size:15px;margin:6px 0;color:var(--navy)}
    .podium span{font-size:32px}

    /* Data Table */
    .data-table{width:100%;border-collapse:collapse;font-size:12.5px}
    .data-table th{text-align:left;color:#475569;background:#f8fafc;padding:12px 10px;white-space:nowrap;font-weight:700}
    .data-table td{padding:12px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    .data-table td.question-cell{min-width:280px;max-width:540px}
    .scroll-x{overflow-x:auto}
    .top-spacer{height:14px}
    .load{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:24px;right:24px;z-index:1000;max-width:420px;background:#0f172a;color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.3);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.5;animation:slideUp .25s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .toast.error{background:#991b1b}
    .question-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .small-note{font-size:11px;color:#64748b;margin-top:6px}
    .loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);display:grid;place-items:center;z-index:900;backdrop-filter:blur(2px)}
    .loading-overlay>div{background:#fff;border-radius:20px;padding:24px 36px;text-align:center;color:var(--navy);font-weight:700;box-shadow:var(--shadow)}
    .bar{height:10px;background:#e2e8f0;border-radius:90px;overflow:hidden;margin:6px 0}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
    .empty{text-align:center;padding:45px 20px;color:#64748b}
    .empty strong{display:block;color:var(--navy);margin:8px 0;font-size:16px}
    .mobile-nav{display:none}

    /* =========================================================================
       HALAMAN RANGKUMAN MATERI (BARU)
       ========================================================================= */
    .summary-filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
    .filter-pills{display:flex;gap:8px;flex-wrap:wrap}
    .filter-btn{padding:7px 14px;border-radius:99px;border:1px solid #cbd5e1;background:#fff;color:#475569;font-size:12px;font-weight:700;transition:all .15s}
    .filter-btn:hover{background:#f8fafc;border-color:#94a3b8}
    .filter-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 3px 8px rgba(37,99,235,.25)}
    .search-box{position:relative;flex:1;max-width:380px;min-width:240px}
    .search-box input{padding-left:36px;border-radius:99px;font-size:13px}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;color:#94a3b8}

    .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
    .summary-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}
    .summary-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px -4px rgba(15,23,42,.1)}
    .summary-card-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
    .summary-card-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
    .summary-card.mtk .summary-card-icon{background:#eff6ff}
    .summary-card.ipas .summary-card-icon{background:#ecfdf5}
    .summary-card h3{margin:0;font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.35}
    .summary-category{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .summary-ringkasan{font-size:13px;color:#334155;line-height:1.6;margin-bottom:14px}
    
    .summary-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .summary-box-title{font-size:11.5px;font-weight:800;color:#475569;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .summary-box ul{margin:0;padding-left:18px;font-size:12.5px;color:#334155;line-height:1.6}
    .summary-box li{margin-bottom:4px}
    .summary-box li:last-child{margin-bottom:0}

    .formula-box{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-bottom:12px;color:#92400e}
    .formula-box-title{font-size:11.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .formula-box code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.7);padding:6px 9px;border-radius:6px;margin:4px 0;line-height:1.4;color:#78350f}

    .example-box{border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;background:#fbfcfe;margin-bottom:16px}
    .example-q{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
    .example-toggle{font-size:11.5px;color:#2563eb;cursor:pointer;font-weight:700;border:0;background:transparent;padding:0;text-decoration:underline}
    .example-ans{font-size:12px;color:#047857;margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e1;line-height:1.5}

    .summary-card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #f1f5f9;gap:10px}

    /* Responsive */
    @media(max-width:1050px){
      .shell{grid-template-columns:72px 1fr}
      .sidebar{padding:20px 8px}
      .logo{justify-content:center;padding:8px 0 20px}
      .logo>div:last-child,.nav-caption,.nav-button span:last-child,.side-foot{display:none}
      .nav-button{justify-content:center;padding:12px 4px}
      .nav-ico{font-size:23px}
      .content{padding:22px}
      .cols-4{grid-template-columns:repeat(2,1fr)}
      .summary-grid{grid-template-columns:1fr}
    }
    @media(max-width:720px){
      .shell{display:block}
      .sidebar{display:none}
      .topbar{height:68px;padding:0 16px}
      .topbar-title{font-size:14px}
      .topbar-sub{display:none}
      .content{padding:16px 14px 96px}
      .hero{padding:24px 20px;border-radius:18px}
      .hero-art{display:none}
      .cols-2,.cols-3,.cols-4,.form-grid,.form-grid.three,.form-grid.four,.quiz-layout{grid-template-columns:1fr}
      .final-scores{gap:8px}
      .team-score{padding:12px 4px}

  </style>
  <!-- Supabase JS Client (Loaded from CDN with safe fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Data Soal Offline-First & Seed -->
  <script src="data_questions.js"></script>
  <!-- Data Rangkuman Materi Lengkap MTK & IPAS Kelas 4 - 6 -->

</head>
<body>
  <div id="app">
    <div class="loading-overlay">
      <div>
        <span class="load"></span>
        <p style="margin-top:12px">Memuat Arena Cerdas Cermat...</p>
      </div>
    </div>
  </div>
  <div id="toast-container" aria-live="polite"></div>

  <script>
    'use strict';
    const APP_VERSION = '2.0.0';

    // State Aplikasi Global
    const S = {
      page: 'dashboard',
      boot: null,
      token: sessionStorage.getItem('ccAdminToken') || '',
      busy: false,
      clockOffset: 0,
      sound: localStorage.getItem('ccSound') !== 'false',
      
      // Supabase State
      supabase: null,
      supabaseConnected: false,
      supabaseUrl: localStorage.getItem('ccSupabaseUrl') || '',
      supabaseKey: localStorage.getItem('ccSupabaseKey') || '',

      // Sesi Latihan & Ujian
      session: null,
      questionIndex: 0,
      answers: {},
      review: null,
      reviewOnlyWrong: false,

      // Bank Soal
      bank: null,
      bankFilter: { page: 0, search: '', mapel: '', kelas: '' },
      editing: null,

      // Evaluasi & Statistik
      stats: null,
      ranking: null,

      // Final & Buzzer
      final: null,
      buzzTeam: null,
      finalDeadline: null,
      finalExpired: false,
      showFinalAnswer: false,

      // Halaman Rangkuman
      summaryFilter: { mapel: '', kelas: '', search: '' },
      summaryOpenAnswers: {}
    };

    const $ = sel => document.querySelector(sel);
    const esc = x => String(x === null || x === undefined ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtDate = ms => new Date(Number(ms)).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
    const clock = seconds => {
      const s = Math.max(0, Math.floor(seconds));
      return Math.floor(s / 3600)
        ? `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
        : `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };

    function toast(message, error = false) {
      const el = document.createElement('div');
      el.className = 'toast' + (error ? ' error' : '');
      el.textContent = message;
      $('#toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4600);
    }

    function busy(on) {
      S.busy = on;
      let el = $('#loader');
      if (on && !el) {
        document.body.insertAdjacentHTML('beforeend', '<div class="loading-overlay" id="loader"><div><span class="load"></span><p style="margin-top:12px">Memproses data...</p></div></div>');
      } else if (!on && el) {
        el.remove();
      }
    }

    async function run(call) {
      busy(true);
      try {
        return await call();
      } catch (e) {
        const message = e.message || String(e);
        toast(message, true);
        if (/Sesi guru kedaluwarsa/i.test(message)) {
          S.token = '';
          sessionStorage.removeItem('ccAdminToken');
          render();
        }
        throw e;
      } finally {
        busy(false);
      }
    }

    // =========================================================================
    // LAYER PENYIMPANAN & KONEKSI SUPABASE DENGAN FALLBACK LOKAL
    // =========================================================================
    
    // Inisialisasi Supabase Client jika URL dan Key tersedia
    async function initSupabase(url, key) {
      if (!url || !key) {
        S.supabase = null;
        S.supabaseConnected = false;
        return false;
      }
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          console.warn('Supabase JS library belum terpasang dari CDN. Menggunakan local storage.');
          return false;
        }
        const client = window.supabase.createClient(url.trim(), key.trim());
        // Tes query ringan ke cc_settings atau cc_questions
        const { data, error } = await client.from('cc_settings').select('key').limit(1);
        if (error && error.code !== 'PGRST116') {
          console.warn('Uji koneksi Supabase gagal:', error.message);
          S.supabase = client; // tetap simpan barangkali tabel belum di-create
          S.supabaseConnected = false;
          return false;
        }
        S.supabase = client;
        S.supabaseConnected = true;
        return true;
      } catch (err) {
        console.error('Inisialisasi Supabase gagal:', err);
        S.supabaseConnected = false;
        return false;
      }
    }

    // Mengambil semua soal aktif (dari Supabase atau data lokal)
    async function dbGetQuestions() {
      if (S.supabaseConnected && S.supabase) {
        try {
          const { data, error } = await S.supabase.from('cc_questions').select('*').order('id');
          if (!error && Array.isArray(data) && data.length > 0) {
            return data.map(q => ({
              ID_SOAL: q.id,
              MAPEL: q.mapel,
              KELAS: q.kelas,
              TOPIK: q.topik,
              BABAK: q.babak,
              LEVEL: q.level,
              TIPE: q.tipe,
              PERTANYAAN: q.pertanyaan,
              OPSI_A: q.opsi_a || '',
              OPSI_B: q.opsi_b || '',
              OPSI_C: q.opsi_c || '',
              OPSI_D: q.opsi_d || '',
              KUNCI: q.kunci,
              PEMBAHASAN: q.pembahasan || '',
              STATUS: q.status || 'AKTIF'
            }));
          }
        } catch (e) {
          console.warn('Gagal memuat soal dari Supabase, beralih ke cache lokal:', e);
        }
      }
      // Fallback: Local Storage atau Seed
      const cached = localStorage.getItem('cc_questions_data');
      if (cached) {
        try {
          return JSON.parse(cached);
        } catch (e) {}
      }
      return typeof QUESTIONS_SEED !== 'undefined' ? QUESTIONS_SEED : [];
    }

    // Simpan data soal ke penyimpanan lokal
    function dbSaveLocalQuestions(questions) {
      try {
        localStorage.setItem('cc_questions_data', JSON.stringify(questions));
      } catch (e) {}
    }

    // Mengambil Pengaturan Aplikasi
    async function dbGetSettings() {
      const defaults = {
        NAMA_SEKOLAH: 'UPTD SPF SD Inpres Tangkala II',
        NAMA_PEMBINA: 'Budianto, S.Pd., Gr.',
        JUDUL: 'ARENA CERDAS CERMAT MIPAS 2026',
        PIN_GURU: '123456'
      };
      if (S.supabaseConnected && S.supabase) {
        try {
          const { data, error } = await S.supabase.from('cc_settings').select('*');
          if (!error && Array.isArray(data)) {
            const out = { ...defaults };
            data.forEach(r => { out[r.key] = r.value; });
            return out;
          }
        } catch (e) {}
      }
      const local = localStorage.getItem('cc_settings_data');
      return local ? { ...defaults, ...JSON.parse(local) } : defaults;
    }

    // Simpan Pengaturan Aplikasi
    async function dbSaveSettings(pairs) {
      if (S.supabaseConnected && S.supabase) {
        try {
          const upserts = Object.keys(pairs).map(k => ({ key: k, value: pairs[k], updated_at: new Date().toISOString() }));
          await S.supabase.from('cc_settings').upsert(upserts);
        } catch (e) {
          console.warn('Gagal menyimpan settings ke Supabase:', e);
        }
      }
      const current = await dbGetSettings();
      const updated = { ...current, ...pairs };
      localStorage.setItem('cc_settings_data', JSON.stringify(updated));
      return updated;
    }

    // Simpan sesi pengerjaan ke database
    async function dbSaveSession(sessionData) {
      if (S.supabaseConnected && S.supabase) {
        try {
          await S.supabase.from('cc_sessions').upsert({
            id: sessionData.id,
            id_tim: sessionData.idTim || '',
            nama_tim: sessionData.teamName || 'Tim Latihan',
            mode: sessionData.mode,
            mulai_ms: sessionData.startedAt,
            batas_ms: sessionData.deadline || 0,
            selesai_ms: sessionData.finishedAt || null,
            skor: sessionData.score !== undefined ? sessionData.score : null,
            maks_skor: sessionData.maximum !== undefined ? sessionData.maximum : null,
            status: sessionData.finished ? 'SELESAI' : 'BERJALAN',
            soal_ids: sessionData.soalIds || [],
            jawaban: sessionData.answers || {}
          });
        } catch (e) {
          console.warn('Gagal sinkron sesi ke Supabase:', e);
        }
      }
      // Simpan lokal
      const list = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]');
      const idx = list.findIndex(s => s.id === sessionData.id);
      if (idx >= 0) list[idx] = sessionData;
      else list.unshift(sessionData);
      localStorage.setItem('cc_sessions_list', JSON.stringify(list.slice(0, 100)));
    }

    // Mengambil riwayat sesi selesai
    async function dbGetCompletedSessions() {
      if (S.supabaseConnected && S.supabase) {
        try {
          const { data, error } = await S.supabase
            .from('cc_sessions')
            .select('*')
            .eq('status', 'SELESAI')
            .order('selesai_ms', { ascending: false })
            .limit(100);
          if (!error && Array.isArray(data)) {
            return data.map(r => ({
              id: r.id,
              team: r.nama_tim,
              mode: r.mode,
              score: Number(r.skor) || 0,
              max: Number(r.maks_skor) || 0,
              finished: Number(r.selesai_ms) || Date.now(),
              duration: Math.max(0, Math.round(((Number(r.selesai_ms) || 0) - (Number(r.mulai_ms) || 0)) / 1000)),
              answers: r.jawaban || {},
              soalIds: r.soal_ids || []
            }));
          }
        } catch (e) {}
      }
      const list = JSON.parse(localStorage.getItem('cc_sessions_list') || '[]');
      return list.filter(s => s.finished).map(s => ({
        id: s.id,
        team: s.teamName,
        mode: s.mode,
        score: s.score || 0,
        max: s.maximum || 0,
        finished: s.finishedAt || Date.now(),
        duration: Math.max(0, Math.round((s.finishedAt - s.startedAt) / 1000)),
        answers: s.answers || {},
        soalIds: s.soalIds || []
      }));
    }

    // =========================================================================
    // API SERVICE & LOGIKA PERMAINAN
    // =========================================================================

    function publicQuestion(q) {
      return {
        id: q.ID_SOAL,
        mapel: q.MAPEL,
        kelas: Number(q.KELAS),
        topik: q.TOPIK,
        babak: q.BABAK,
        level: q.LEVEL,
        tipe: q.TIPE || 'PG',
        text: q.PERTANYAAN,
        options: [q.OPSI_A, q.OPSI_B, q.OPSI_C, q.OPSI_D].filter(Boolean)
      };
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const api = {
      async getBootstrap() {
        const settings = await dbGetSettings();
        const questions = await dbGetQuestions();
        const active = questions.filter(q => q.STATUS === 'AKTIF');
        const counts = { MATEMATIKA: 0, IPA: 0, IPS: 0 };
        active.forEach(q => { if (counts[q.MAPEL] !== undefined) counts[q.MAPEL]++; });
        return {
          version: APP_VERSION,
          settings,
          serverNow: Date.now(),
          counts,
          totalQuestions: active.length,
          supabaseConnected: S.supabaseConnected
        };
      },

      async loginAdmin(pin) {
        const settings = await dbGetSettings();
        const currentPin = (settings.PIN_GURU || '123456').trim();
        if (pin.trim() !== currentPin) {
          throw new Error('PIN Guru tidak sesuai.');
        }
        const token = 'token-' + Math.random().toString(36).substr(2, 10);
        return { token };
      },

      async createSession(payload) {
        const all = (await dbGetQuestions()).filter(q => q.STATUS === 'AKTIF');
        const mode = (payload.mode || 'LATIHAN').toUpperCase();
        const teamName = (payload.teamName || 'Tim Cerdas').trim();
        let selected = [], seconds = 0;

        if (mode === 'PENYISIHAN' || mode === 'SEMIFINAL') {
          // 10 Matematika, 10 IPA, 10 IPS
          ['MATEMATIKA', 'IPA', 'IPS'].forEach(m => {
            const pool = all.filter(q => q.MAPEL === m && q.TIPE === 'PG');
            selected.push(...shuffle(pool).slice(0, 10));
          });
          selected = shuffle(selected);
          seconds = 2700; // 45 menit
        } else {
          // Latihan Mandiri / Cepat
          const count = Math.min(50, Math.max(5, Number(payload.count) || 10));
          let pool = all.filter(q => q.TIPE === 'PG');
          if (payload.mapel) pool = pool.filter(q => q.MAPEL === payload.mapel);
          if (payload.kelas) pool = pool.filter(q => Number(q.KELAS) === Number(payload.kelas));
          if (payload.level) pool = pool.filter(q => q.LEVEL === payload.level);
          
          selected = shuffle(pool).slice(0, count);
          if (selected.length < count) {
            // fallback jika filter terlalu ketat
            const fallback = shuffle(all.filter(q => !selected.includes(q)));
            selected.push(...fallback.slice(0, count - selected.length));
          }
          seconds = mode === 'CEPAT'
            ? selected.length * Math.min(30, Math.max(10, Number(payload.fastSeconds) || 15))
            : (payload.timed ? selected.length * 60 : 0);
        }

        const now = Date.now();
        const id = 'SESI-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        const sessionObj = {
          id,
          idTim: 'TIM-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
          mode,
          teamName,
          startedAt: now,
          deadline: seconds ? now + seconds * 1000 : null,
          questions: selected.map(publicQuestion),
          soalIds: selected.map(q => q.ID_SOAL),
          answers: {},
          finished: false
        };

        await dbSaveSession(sessionObj);
        return sessionObj;
      },

      async saveAnswers(id, answers) {
        const session = S.session;
        if (session && session.id === id) {
          session.answers = answers;
          await dbSaveSession({ ...session, answers });
        }
        return { saved: true };
      },

      async submitSession(id, answers) {
        const allQuestions = await dbGetQuestions();
        const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));
        const session = S.session;
        if (!session || session.id !== id) throw new Error('Sesi tidak ditemukan.');

        const pts = (session.mode === 'PENYISIHAN' || session.mode === 'SEMIFINAL') ? 4 : 1;
        const items = session.questions.map(pq => {
          const raw = qMap.get(pq.id);
          const chosen = answers[pq.id] || '';
          const correct = chosen && raw && chosen.toUpperCase() === raw.KUNCI.trim().toUpperCase();
          return {
            ...pq,
            chosen,
            correct: !!correct,
            answer: raw ? raw.KUNCI : '',
            explanation: raw ? raw.PEMBAHASAN : '',
            points: correct ? pts : 0
          };
        });

        const score = items.reduce((s, it) => s + it.points, 0);
        const maximum = session.questions.length * pts;
        const correctCount = items.filter(it => it.correct).length;
        const finishedAt = Date.now();

        const review = {
          score,
          maximum,
          correct: correctCount,
          total: session.questions.length,
          items,
          finishedAt
        };

        session.finished = true;
        session.finishedAt = finishedAt;
        session.score = score;
        session.maximum = maximum;
        session.review = review;
        await dbSaveSession(session);

        return review;
      },

      async listQuestions(token, filter) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = await dbGetQuestions();
        let filtered = all;
        if (filter.mapel) filtered = filtered.filter(q => q.MAPEL === filter.mapel);
        if (filter.kelas) filtered = filtered.filter(q => Number(q.KELAS) === Number(filter.kelas));
        if (filter.search) {
          const s = filter.search.toLowerCase();
          filtered = filtered.filter(q =>
            q.PERTANYAAN.toLowerCase().includes(s) ||
            q.TOPIK.toLowerCase().includes(s) ||
            q.ID_SOAL.toLowerCase().includes(s)
          );
        }
        const page = filter.page || 0;
        const pageSize = 30;
        const paged = filtered.slice(page * pageSize, (page + 1) * pageSize);
        return {
          total: filtered.length,
          page,
          items: paged.map(q => ({
            id: q.ID_SOAL,
            mapel: q.MAPEL,
            kelas: q.KELAS,
            topik: q.TOPIK,
            babak: q.BABAK,
            level: q.LEVEL,
            tipe: q.TIPE,
            text: q.PERTANYAAN,
            options: [q.OPSI_A, q.OPSI_B, q.OPSI_C, q.OPSI_D],
            answer: q.KUNCI,
            explanation: q.PEMBAHASAN,
            active: q.STATUS === 'AKTIF'
          }))
        };
      },

      async saveQuestion(token, qData) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const questions = await dbGetQuestions();
        const id = qData.id || ('Q-' + Date.now().toString(36).toUpperCase());
        const formatted = {
          ID_SOAL: id,
          MAPEL: qData.mapel,
          KELAS: Number(qData.kelas),
          TOPIK: qData.topik,
          BABAK: qData.babak || 'UMUM',
          LEVEL: qData.level || 'SEDANG',
          TIPE: qData.tipe || 'PG',
          PERTANYAAN: qData.text,
          OPSI_A: (qData.options || [])[0] || '',
          OPSI_B: (qData.options || [])[1] || '',
          OPSI_C: (qData.options || [])[2] || '',
          OPSI_D: (qData.options || [])[3] || '',
          KUNCI: qData.answer,
          PEMBAHASAN: qData.explanation || '',
          STATUS: qData.active ? 'AKTIF' : 'NONAKTIF'
        };

        if (S.supabaseConnected && S.supabase) {
          try {
            await S.supabase.from('cc_questions').upsert({
              id: formatted.ID_SOAL,
              mapel: formatted.MAPEL,
              kelas: formatted.KELAS,
              topik: formatted.TOPIK,
              babak: formatted.BABAK,
              level: formatted.LEVEL,
              tipe: formatted.TIPE,
              pertanyaan: formatted.PERTANYAAN,
              opsi_a: formatted.OPSI_A,
              opsi_b: formatted.OPSI_B,
              opsi_c: formatted.OPSI_C,
              opsi_d: formatted.OPSI_D,
              kunci: formatted.KUNCI,
              pembahasan: formatted.PEMBAHASAN,
              status: formatted.STATUS,
              updated_at: new Date().toISOString()
            });
          } catch (e) {
            console.warn('Gagal menyimpan soal ke Supabase:', e);
          }
        }

        const idx = questions.findIndex(q => q.ID_SOAL === id);
        if (idx >= 0) questions[idx] = formatted;
        else questions.unshift(formatted);
        dbSaveLocalQuestions(questions);
        return { success: true };
      },

      async disableQuestion(token, id) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const questions = await dbGetQuestions();
        const q = questions.find(item => item.ID_SOAL === id);
        if (q) {
          q.STATUS = 'NONAKTIF';
          if (S.supabaseConnected && S.supabase) {
            try {
              await S.supabase.from('cc_questions').update({ status: 'NONAKTIF' }).eq('id', id);
            } catch (e) {}
          }
          dbSaveLocalQuestions(questions);
        }
        return { success: true };
      },

      async exportQuestions(token) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        return await dbGetQuestions();
      },

      async importQuestions(token, inputs) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const questions = await dbGetQuestions();
        let imported = 0, skipped = 0;
        const upsertList = [];

        inputs.forEach(item => {
          if (!item.text || !item.answer) {
            skipped++;
            return;
          }
          const id = item.id || ('IMP-' + Math.random().toString(36).substr(2, 7).toUpperCase());
          const q = {
            ID_SOAL: id,
            MAPEL: (item.mapel || 'MATEMATIKA').toUpperCase(),
            KELAS: Number(item.kelas) || 4,
            TOPIK: item.topik || 'Umum',
            BABAK: item.babak || 'UMUM',
            LEVEL: item.level || 'SEDANG',
            TIPE: item.tipe || 'PG',
            PERTANYAAN: item.text,
            OPSI_A: (item.options || [])[0] || '',
            OPSI_B: (item.options || [])[1] || '',
            OPSI_C: (item.options || [])[2] || '',
            OPSI_D: (item.options || [])[3] || '',
            KUNCI: item.answer,
            PEMBAHASAN: item.explanation || '',
            STATUS: item.active !== false ? 'AKTIF' : 'NONAKTIF'
          };
          upsertList.push(q);
          const existing = questions.findIndex(x => x.ID_SOAL === id);
          if (existing >= 0) questions[existing] = q;
          else questions.push(q);
          imported++;
        });

        if (S.supabaseConnected && S.supabase && upsertList.length > 0) {
          try {
            const rows = upsertList.map(q => ({
              id: q.ID_SOAL,
              mapel: q.MAPEL,
              kelas: q.KELAS,
              topik: q.TOPIK,
              babak: q.BABAK,
              level: q.LEVEL,
              tipe: q.TIPE,
              pertanyaan: q.PERTANYAAN,
              opsi_a: q.OPSI_A,
              opsi_b: q.OPSI_B,
              opsi_c: q.OPSI_C,
              opsi_d: q.OPSI_D,
              kunci: q.KUNCI,
              pembahasan: q.PEMBAHASAN,
              status: q.STATUS
            }));
            await S.supabase.from('cc_questions').upsert(rows);
          } catch (e) {
            console.warn('Gagal import ke Supabase:', e);
          }
        }

        dbSaveLocalQuestions(questions);
        return { imported, skipped };
      },

      async getStatistics(token) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const sessions = await dbGetCompletedSessions();
        const allQuestions = await dbGetQuestions();
        const qMap = new Map(allQuestions.map(q => [q.ID_SOAL, q]));

        const totalSesi = sessions.length;
        const avgAcc = totalSesi
          ? Math.round(sessions.reduce((s, it) => s + (it.score / Math.max(1, it.max)) * 100, 0) / totalSesi)
          : 0;

        const subjectStats = { MATEMATIKA: { correct: 0, total: 0 }, IPA: { correct: 0, total: 0 }, IPS: { correct: 0, total: 0 } };
        const topicStats = {};

        sessions.slice(0, 50).forEach(s => {
          const ans = s.answers || {};
          (s.soalIds || []).forEach(qid => {
            const q = qMap.get(qid);
            if (!q) return;
            const chosen = ans[qid];
            const isCorrect = chosen && chosen.toUpperCase() === q.KUNCI.trim().toUpperCase();
            
            if (subjectStats[q.MAPEL]) {
              subjectStats[q.MAPEL].total++;
              if (isCorrect) subjectStats[q.MAPEL].correct++;
            }

            if (!topicStats[q.TOPIK]) topicStats[q.TOPIK] = { topic: q.TOPIK, correct: 0, total: 0 };
            topicStats[q.TOPIK].total++;
            if (isCorrect) topicStats[q.TOPIK].correct++;
          });
        });

        const weakTopics = Object.values(topicStats)
          .filter(t => t.total >= 3)
          .sort((a, b) => (a.correct / a.total) - (b.correct / b.total))
          .slice(0, 5);

        return {
          sessions: totalSesi,
          average: avgAcc,
          recent: sessions.slice(0, 50),
          subjectStats,
          weakTopics
        };
      },

      async leaderboard(token, mode) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const sessions = await dbGetCompletedSessions();
        const filtered = sessions.filter(s => s.mode === mode);
        const bestByTeam = new Map();

        filtered.forEach(s => {
          const prev = bestByTeam.get(s.team);
          if (!prev || s.score > prev.score || (s.score === prev.score && s.duration < prev.duration)) {
            bestByTeam.set(s.team, s);
          }
        });

        const sorted = Array.from(bestByTeam.values()).sort((a, b) => b.score - a.score || a.duration - b.duration);
        return sorted.map((s, idx) => ({
          rank: idx + 1,
          team: s.team,
          score: s.score,
          seconds: s.duration,
          qualified: idx < (mode === 'PENYISIHAN' ? 8 : 3)
        }));
      },

      // Pertandingan Final & Buzzer
      async createFinalMatch(token, teamNames) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = (await dbGetQuestions()).filter(q => q.STATUS === 'AKTIF');
        const used = new Set();

        const mandatory = [];
        for (let round = 0; round < 2; round++) {
          for (let team = 0; team < 3; team++) {
            ['MATEMATIKA', 'IPA', 'IPS'].forEach(subject => {
              const cand = all.filter(q => q.MAPEL === subject && !used.has(q.ID_SOAL));
              if (cand.length) {
                const picked = cand[0];
                used.add(picked.ID_SOAL);
                mandatory.push({ team, id: picked.ID_SOAL });
              }
            });
          }
        }

        const rebutan = [];
        ['MATEMATIKA', 'IPA', 'IPS'].forEach(subject => {
          const cand = all.filter(q => q.MAPEL === subject && !used.has(q.ID_SOAL)).slice(0, 5);
          cand.forEach(q => { used.add(q.ID_SOAL); rebutan.push(q.ID_SOAL); });
        });

        const extra = all.filter(q => !used.has(q.ID_SOAL)).map(q => q.ID_SOAL);

        const match = {
          id: 'FINAL-' + Date.now().toString(36).toUpperCase(),
          teams: teamNames.map((name, i) => ({ id: 'T' + (i + 1), name, score: 0 })),
          phase: 'WAJIB',
          wajib: mandatory,
          wajibIndex: 0,
          rebutan: shuffle(rebutan),
          rebutanIndex: 0,
          extra: shuffle(extra),
          extraIndex: 0,
          blockedTeams: [],
          logs: []
        };

        if (S.supabaseConnected && S.supabase) {
          try {
            await S.supabase.from('cc_final_matches').upsert({ id: match.id, state: match });
          } catch (e) {}
        }
        localStorage.setItem('cc_final_current', JSON.stringify(match));
        return api.matchView(match, all);
      },

      matchView(match, allQuestions) {
        let currentId = null, mandatoryTeam = null;
        if (match.phase === 'WAJIB') {
          const item = match.wajib[match.wajibIndex];
          if (item) { currentId = item.id; mandatoryTeam = item.team; }
        } else if (match.phase === 'REBUTAN') {
          currentId = match.rebutan[match.rebutanIndex];
        } else if (match.phase === 'TAMBAHAN') {
          currentId = match.extra[match.extraIndex];
        }

        const q = currentId ? allQuestions.find(it => it.ID_SOAL === currentId) : null;
        const total = match.phase === 'WAJIB' ? match.wajib.length : match.phase === 'REBUTAN' ? match.rebutan.length : null;
        const index = match.phase === 'WAJIB' ? match.wajibIndex : match.phase === 'REBUTAN' ? match.rebutanIndex : match.extraIndex;

        return {
          id: match.id,
          teams: match.teams,
          phase: match.phase,
          index,
          total,
          mandatoryTeam,
          eligible: [0, 1, 2].filter(t => !match.blockedTeams.includes(t)),
          question: q ? {
            ...publicQuestion(q),
            answer: q.KUNCI,
            answerText: ['A', 'B', 'C', 'D'].includes(q.KUNCI) ? q['OPSI_' + q.KUNCI] : q.KUNCI,
            explanation: q.PEMBAHASAN
          } : null,
          logs: match.logs.slice(-10)
        };
      },

      async getFinalMatch(token, id) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = await dbGetQuestions();
        const raw = localStorage.getItem('cc_final_current');
        if (!raw) throw new Error('Pertandingan final tidak ditemukan.');
        return api.matchView(JSON.parse(raw), all);
      },

      async adjudicateFinal(token, matchId, teamIndex, action) {
        if (!token) throw new Error('Sesi guru diperlukan.');
        const all = await dbGetQuestions();
        const raw = localStorage.getItem('cc_final_current');
        if (!raw) throw new Error('Pertandingan tidak ditemukan.');
        const match = JSON.parse(raw);

        const change = action === 'BENAR' ? 10 : action === 'SALAH' && match.phase !== 'WAJIB' ? -5 : 0;
        match.teams[teamIndex].score += change;
        match.logs.push({
          phase: match.phase,
          team: teamIndex,
          action,
          change,
          at: Date.now()
        });

        if (action === 'LEMPAR') {
          match.blockedTeams.push(teamIndex);
          if (match.blockedTeams.length >= 3) action = 'KOSONG';
        }

        if (action !== 'LEMPAR') {
          match.blockedTeams = [];
          if (match.phase === 'WAJIB') {
            match.wajibIndex++;
            if (match.wajibIndex >= match.wajib.length) match.phase = 'REBUTAN';
          } else if (match.phase === 'REBUTAN') {
            match.rebutanIndex++;
            if (match.rebutanIndex >= match.rebutan.length) {
              // Cek seri
              const scores = match.teams.map(t => t.score);
              const maxScore = Math.max(...scores);
              const tied = match.teams.filter(t => t.score === maxScore);
              match.phase = tied.length > 1 ? 'TAMBAHAN' : 'SELESAI';
            }
          } else if (match.phase === 'TAMBAHAN') {
            match.extraIndex++;
            const scores = match.teams.map(t => t.score);
            const maxScore = Math.max(...scores);
            const tied = match.teams.filter(t => t.score === maxScore);
            if (tied.length <= 1 || match.extraIndex >= match.extra.length) {
              match.phase = 'SELESAI';
            }
          }
        }

        if (S.supabaseConnected && S.supabase) {
          try {
            await S.supabase.from('cc_final_matches').upsert({ id: match.id, state: match });
          } catch (e) {}
        }
        localStorage.setItem('cc_final_current', JSON.stringify(match));
        return api.matchView(match, all);
      }
    };

    function sound(freq = 660) {
      if (!S.sound) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 160);
      } catch (e) {}
    }

    // =========================================================================
    // VIEW: QUIZ & PENGERJAAN SOAL
    // =========================================================================
    function quizView() {
      const session = S.session;
      if (!session) return dashboardView();
      const qs = session.questions, idx = S.questionIndex, q = qs[idx];
      const count = Object.keys(S.answers).filter(k => S.answers[k]).length;
      const fraction = Math.round((count / qs.length) * 100);
      const deadline = Number(session.deadline);

      return `
        <div class="quiz-top">
          <div>
            <div class="pill blue">${esc(session.mode)} • ${esc(session.teamName)}</div>
            <h2 style="margin:8px 0 0">Soal Nomor ${idx + 1} dari ${qs.length}</h2>
          </div>
          <div class="timer" id="quizTimer">${deadline ? '--:--' : '⏱ Tanpa Batas'}</div>
        </div>
        <div class="progress"><div style="width:${fraction}%"></div></div>

        <div class="quiz-layout">
          <div>
            ${card(`
              <div class="question-actions">
                <span class="pill ${q.mapel === 'MATEMATIKA' ? 'blue' : 'green'}">${esc(q.mapel)} • Kelas ${q.kelas}</span>
                <span class="subtle">${esc(q.topik)}</span>
              </div>
              <div class="question-text">${esc(q.text)}</div>
              ${q.options.map((opt, i) => {
                const letter = 'ABCD'[i];
                return `
                  <button class="option ${S.answers[q.id] === letter ? 'selected' : ''}" data-action="answer" data-key="${letter}">
                    <span class="option-letter">${letter}</span>
                    <span>${esc(opt)}</span>
                  </button>
                `;
              }).join('')}
              <div class="question-control">
                <button class="btn secondary" data-action="previous" ${idx === 0 ? 'disabled' : ''}>← Sebelumnya</button>
                ${idx < qs.length - 1
                  ? `<button class="btn" data-action="next">Berikutnya →</button>`
                  : `<button class="btn good" data-action="submitQuiz">Kumpulkan Jawaban ✓</button>`}
              </div>
            `)}
          </div>
          <div>
            ${card(`
              <h3 style="margin:0 0 4px">Navigasi Lembar Soal</h3>
              <p class="subtle">${count} dari ${qs.length} soal sudah dijawab</p>
              <div class="number-grid">
                ${qs.map((item, i) => `
                  <button data-action="jump" data-index="${i}" class="${i === idx ? 'current' : (S.answers[item.id] ? 'done' : '')}">
                    ${i + 1}
                  </button>
                `).join('')}
              </div>
              <hr class="separator">
              <button class="btn good full" data-action="submitQuiz">✓ Kumpulkan Sekarang</button>
            `)}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW: HASIL & PEMBAHASAN
    // =========================================================================
    function resultView() {
      const r = S.review;

      const pct = Math.round((100 * r.score) / Math.max(1, r.maximum));

      return `
        ${card(`
          <div style="text-align:center;padding:10px 0">
            <div style="font-size:52px">${pct >= 80 ? '🏆' : (pct >= 60 ? '🌟' : '📚')}</div>
            <div class="eyebrow" style="color:#64748b">HASIL PENGERJAAN LATIHAN</div>
            <div class="result-score">${r.score}<span style="font-size:24px;color:#94a3b8"> / ${r.maximum}</span></div>
            <h2>${pct}% Ketepatan</h2>
            <p class="subtle">${r.correct} dari ${r.total} soal dijawab dengan benar</p>
            <div class="btn-row" style="justify-content:center;margin-top:16px">
              <button class="btn" data-action="navigate" data-page="practice">Ulangi Latihan</button>

          </div>

        ${entries.map(q => `
          <div class="result-answer ${q.correct ? 'correct' : 'wrong'}">
            <div class="question-actions" style="margin-bottom:6px">
              <strong>${esc(q.mapel)} • Kelas ${q.kelas} • ${esc(q.topik)}</strong>

    function finalView() {
      if (!S.token) return loginRequired('Simulasi Babak Final & Buzzer');
      if (!S.final) {
        return `
          ${heading('Arena Final & Buzzer 3 Tim', 'Pertandingan final seru dengan soal wajib per tim dan soal rebutan dengan buzzer interaktif.')}
          ${card(`
            <div class="notice">

            <div class="grid form-grid three">
              ${input('Nama Tim Merah (Kiri)', 'finalTeam1', 'Tim Merah')}

            <button class="btn secondary" data-action="resumeFinal">↻ Muat Sesi Final Terakhir</button>
          `)}
        `;
      }

      const f = S.final, q = f.question;
      const phaseNames = { WAJIB: 'SESI I • SOAL WAJIB', REBUTAN: 'SESI II • SOAL REBUTAN', TAMBAHAN: 'BABAK TAMBAHAN', SELESAI: 'PERTANDINGAN SELESAI' };
      const players = f.teams.map((t, i) => `
        <div class="team-score ${f.mandatoryTeam === i || S.buzzTeam === i ? 'active' : ''}">
          <h3>${['🔴', '🔵', '🟢'][i]} ${esc(t.name)}</h3>
          <strong>${t.score}</strong>
          <span class="subtle">poin</span>
        </div>
      `).join('');

      if (f.phase === 'SELESAI') {
        const ranking = f.teams.slice().sort((a, b) => b.score - a.score);
        return `
          ${heading('Hasil Akhir Pertandingan Final', 'Selamat kepada tim juara cerdas cermat MIPAS 2026!')}
          <div class="notice success">🏆 Pertandingan telah selesai secara resmi.</div>
          <div class="final-scores">${players}</div>
          <div class="podium">
            <div class="place"><span>🥈</span><strong>${esc(ranking[1]?.name || 'Juara 2')}</strong><small>${ranking[1]?.score || 0} poin</small></div>
            <div class="place"><span>🥇</span><strong>${esc(ranking[0]?.name || 'Juara 1')}</strong><small>${ranking[0]?.score || 0} poin</small></div>
            <div class="place"><span>🥉</span><strong>${esc(ranking[2]?.name || 'Juara 3')}</strong><small>${ranking[2]?.score || 0} poin</small></div>
          </div>
          <button class="btn" data-action="resetFinal">Buat Pertandingan Baru</button>
        `;
      }

      const required = f.phase === 'WAJIB';
      const canBuzz = !required && !S.finalExpired;

      return `
        <div class="quiz-top">
          <div>
            <div class="pill gold">${esc(phaseNames[f.phase] || f.phase)}</div>
            <h2 style="margin:6px 0">${f.total ? `Soal ${f.index + 1} / ${f.total}` : `Soal Tambahan ${f.index + 1}`}</h2>
          </div>
          <div class="timer" id="finalTimer">${S.finalDeadline ? '--:--' : '⏱ ' + (required ? '00:30' : '03:00')}</div>
        </div>
        <div class="final-scores">${players}</div>

        ${card(`
          <div class="question-actions">
            <span class="pill ${q?.mapel === 'MATEMATIKA' ? 'blue' : 'green'}">${esc(q?.mapel || '')} • Kelas ${esc(q?.kelas || '')}</span>
            ${required
              ? `<span class="pill gold">Giliran Wajib: ${esc(f.teams[f.mandatoryTeam]?.name || '')}</span>`
              : `<span class="pill">${S.buzzTeam === null ? 'Menunggu Bel Buzzer' : 'Pemenang Buzzer: ' + esc(f.teams[S.buzzTeam]?.name)}</span>`}
          </div>
          <div class="question-text">${esc(q?.text || 'Soal tidak ditemukan')}</div>
          
          <div class="btn-row">
            <button class="btn secondary" data-action="startFinalTimer">▶ Mulai Hitung Mundur / Bacakan Soal</button>
            <button class="btn ghost" data-action="toggleFinalAnswer">${S.showFinalAnswer ? 'Sembunyikan Kunci' : '👁️ Tampilkan Kunci Jawaban'}</button>
          </div>

          ${S.showFinalAnswer ? `
            <div class="notice success" style="margin-top:14px">
              <strong>Kunci: ${esc(q?.answerText || q?.answer || '')}</strong>
              <div>${esc(q?.explanation || '')}</div>
            </div>
          ` : ''}

          ${required ? `
            <div class="score-action">
              <button class="btn good" data-action="judge" data-team="${f.mandatoryTeam}" data-result="BENAR">✓ Benar (+10)</button>
              <button class="btn danger" data-action="judge" data-team="${f.mandatoryTeam}" data-result="SALAH">✕ Salah (0)</button>
              <button class="btn ghost" data-action="judge" data-team="${f.mandatoryTeam}" data-result="KOSONG">Lewat / Waktu Habis (0)</button>
            </div>
          ` : `
            <h3 style="margin:20px 0 6px">Tekan Bel Buzzer Tim untuk Merebut Kesempatan Menjawab:</h3>
            <div class="buzzer-grid">
              ${f.teams.map((t, i) => `
                <button class="buzzer ${S.buzzTeam === i ? 'winner' : ''}" data-action="buzz" data-team="${i}" ${!canBuzz || S.buzzTeam !== null || !f.eligible.includes(i) ? 'disabled' : ''}>
                  🔔<br>${esc(t.name)}
                </button>
              `).join('')}
            </div>
            ${S.buzzTeam !== null ? `
              <div class="notice" style="margin:14px 0">
                🎙️ Hak menjawab diberikan kepada: <b>${esc(f.teams[S.buzzTeam].name)}</b>
              </div>
              <div class="score-action">
                <button class="btn good" data-action="judge" data-team="${S.buzzTeam}" data-result="BENAR">✓ Benar (+10)</button>
                <button class="btn danger" data-action="judge" data-team="${S.buzzTeam}" data-result="SALAH">✕ Salah (−5)</button>
                <button class="btn secondary" data-action="passFinal" data-team="${S.buzzTeam}">↪ Lempar Soal (Hening 3 Detik)</button>
              </div>
            ` : ''}
            <div class="btn-row" style="margin-top:14px">
              <button class="btn ghost sm" data-action="finalExpire">Soal Hangus / Tidak Terjawab</button>
            </div>
          `}
        `)}

        <div class="top-spacer"></div>
        <div class="question-actions">
          <button class="btn ghost sm" data-action="resetFinal">Akhiri Pertandingan</button>
        </div>
      `;
    }

    function csvDownload(filename, rows) {
      const escape = v => {
        const s = String(v ?? '');
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const body = '\ufeff' + rows.map(r => r.map(escape).join(',')).join('\r\n');
      const blob = new Blob([body], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // Parser & Handler Impor CSV
    function parseCsv(text) {
      const rows = [];
      let row = [], field = '', quote = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quote) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') quote = false;
          else field += c;
        } else if (c === '"') quote = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          if (row.some(x => x.trim())) rows.push(row);
          row = []; field = '';
        } else field += c;
      }
      row.push(field);
      if (row.some(x => x.trim())) rows.push(row);
      if (quote) throw new Error('File CSV memiliki tanda petik yang tidak tertutup.');
      return rows;
    }

    async function handleCsvUpload(file) {
      if (!file) return;
      const text = await file.text();
      const rows = parseCsv(text.replace(/^\ufeff/, ''));
      if (!rows.length) throw new Error('File CSV kosong.');
      const headers = rows.shift().map(s => s.trim());
      const data = rows.map(row => {
        const o = {};
        headers.forEach((h, i) => o[h] = row[i] || '');
        return {
          id: o.id,
          mapel: o.mapel,
          kelas: o.kelas,
          topik: o.topik,
          babak: o.babak,
          level: o.level,
          tipe: o.tipe,
          text: o.text,
          options: [o.A, o.B, o.C, o.D],
          answer: o.answer,
          explanation: o.explanation,
          active: String(o.active).toLowerCase() !== 'false'
        };
      });
      const res = await run(() => api.importQuestions(S.token, data));
      toast(`Impor selesai: ${res.imported} soal berhasil ditambahkan (${res.skipped} dilewati).`);
      S.bankFilter.page = 0;
      await reloadBank();
    }

    // Event Listener Klik
    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-action]');
      if (!el || el.disabled || el.dataset.action === 'buzz') return;
      ev.preventDefault();
      handleAction(el.dataset.action, el).catch(err => toast(err.message || String(err), true));
    });

    // Event Listener Buzzer (Touch & Click cepat)
    document.addEventListener('pointerdown', ev => {
      const el = ev.target.closest('[data-action="buzz"]');
      if (!el || el.disabled || !S.final || S.final.phase === 'WAJIB' || S.buzzTeam !== null || S.finalExpired) return;
      const team = Number(el.dataset.team);
      if (!S.final.eligible.includes(team)) return;
      ev.preventDefault();
      S.buzzTeam = team;
      sound([520, 680, 840][team]);
      render();
    }, { passive: false });

    // Event Listener Pencarian Rangkuman
    document.addEventListener('input', ev => {
      if (ev.target.id === 'summarySearch') {
        S.summaryFilter.search = ev.target.value;
        const container = $('.summary-grid');
        const emptyEl = $('.card.empty');
        // Render cepat ulang hanya summary
        if (S.page === 'summary') {
          clearTimeout(window._searchTimer);
          window._searchTimer = setTimeout(render, 150);
        }
      }
    });

    // Event Listener Berkas CSV
    document.addEventListener('change', ev => {
      if (ev.target.id === 'csvFile' && ev.target.files?.[0]) {
        handleCsvUpload(ev.target.files[0]).catch(e => toast(e.message, true));
        ev.target.value = '';
      }
    });

    // Inisialisasi Aplikasi
    async function init() {
      try {
        if (S.supabaseUrl && S.supabaseKey) {
          await initSupabase(S.supabaseUrl, S.supabaseKey);
        }
        S.boot = await api.getBootstrap();
        render();
        setInterval(updateClocks, 1000);
      } catch (e) {
        console.error('Inisialisasi aplikasi gagal:', e);
        $('#app').innerHTML = `
          <main style="max-width:640px;margin:12vh auto;padding:24px">
            <div class="card" style="text-align:center">
              <h2>⚠️ Gagal Memuat Aplikasi</h2>
              <p>${esc(e.message || String(e))}</p>
              <button class="btn" onclick="location.reload()">Muat Ulang</button>
            </div>
          </main>
        `;
      }
    }

    init();
  </script>
</body>
</html>
