rong{border-left:5px solid var(--red)}.result-answer strong{display:block;margin-bottom:5px}.result-answer p{margin:7px 0;font-size:12px;line-height:1.6;color:#5b6b87}

    @media(max-width:700px){

<body>
  <div id="app"><div class="loading-overlay"><div><span class="load"></span><p>Memuat Arena Cerdas Cermat...</p></div></div></div>
  <div id="toast-container" aria-live="polite"></div>
  <script>
    'use strict';
    const CLIENT_VERSION='1.3.0';
    const S={page:'dashboard',boot:null,token:sessionStorage.getItem('ccAdminToken')||'',busy:false,clockOffset:0,
      session:null,questionIndex:0,answers:{},review:null,reviewOnlyWrong:false,sessionResult:null,
      bank:null,bankFilter:{page:0,search:'',mapel:'',kelas:''},editing:null,stats:null,ranking:null,
      final:null,buzzTeam:null,finalDeadline:null,finalExpired:false,sound:true,lastQuestionKey:''};
    const $=sel=>document.querySelector(sel);
    const esc=x=>String(x===null||x===undefined?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate=ms=>new Date(Number(ms)).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
    const clock=seconds=>{const s=Math.max(0,Math.floor(seconds));return Math.floor(s/3600)?`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
    function api(name,...args){return new Promise((resolve,reject)=>{
      if(!window.google||!google.script||!google.script.run){reject(new Error('Aplikasi harus dibuka melalui URL deployment Google Apps Script.'));return;}
      google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message||String(err))))[name](...args);
    });}
    function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;$('#toast-container').appendChild(el);setTimeout(()=>el.remove(),4800);}
    function busy(on){S.busy=on;let el=$('#loader');if(on&&!el){document.body.insertAdjacentHTML('beforeend','<div class="loading-overlay" id="loader"><div><span class="load"></span><p>Memproses...</p></div></div>');}else if(!on&&el)el.remove();}
    async function run(call){busy(true);try{return await call();}catch(e){const message=e.message||String(e);toast(message,true);if(/Sesi guru kedaluwarsa/i.test(message)){S.token='';sessionStorage.removeItem('ccAdminToken');S.editing=null;render();}throw e;}finally{busy(false);}}
    const subjectIcon={MATEMATIKA:'🔢',IPA:'🌿',IPS:'🌏'};
    const menu=[['dashboard','🏠','Dashboard'],['practice','🧠','Latihan Mandiri'],['exam','🏆','Simulasi Lomba'],['final','⚡','Final & Buzzer'],['bank','📚','Bank Soal Guru'],['stats','📊','Evaluasi'],['settings','⚙️','Pengaturan']];
    function navHtml(){return menu.map(([id,icon,label])=>`<button type="button" class="nav-button ${S.page===id?'active':''}" data-action="navigate" data-page="${id}"><span class="nav-ico">${icon}</span><span>${label}</span></button>`).join('');}
    function layout(content){const title=esc(S.boot?.settings?.JUDUL||'ARENA CERDAS CERMAT MIPAS 2026');return `<div class="shell"><aside class="sidebar"><div class="logo"><div class="logo-emblem">🏆</div><div><strong>ARENA MIPAS</strong><small>SEA Competition 2026</small></div></div><div class="nav-caption">Menu Utama</div>${navHtml()}<div class="side-foot">${esc(S.boot?.settings?.NAMA_SEKOLAH||'UPTD SPF SD Inpres Tangkala II')}<br>Versi ${esc(S.boot?.version||'1.0')}</div></aside><main class="main"><div class="topbar"><div><div class="topbar-title">${title}</div><div class="topbar-sub">${esc(S.boot?.settings?.NAMA_SEKOLAH||'Latihan untuk kelas IV, V, VI')}</div></div><div class="badge">${S.token?'🔓 Mode Guru':'✨ Mode Latihan'}</div></div><div class="content">${content}</div></main></div><nav class="mobile-nav">${[['dashboard','🏠','Beranda'],['practice','🧠','Latihan'],['exam','🏆','Lomba'],['final','⚡','Final'],['bank','📚','Soal']].map(([id,ico,label])=>`<button data-action="navigate" data-page="${id}"><span>${ico}</span>${label}</button>`).join('')}</nav>`;}
    const heading=(name,desc='')=>`<div class="heading"><div><h2>${esc(name)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div></div>`;
    const card=(content,css='')=>`<div class="card ${css}">${content}</div>`;
    const input=(label,id,value='',type='text',placeholder='')=>`<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;
    const select=(label,id,options,value='')=>`<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
    const subjOpts=[['','Campuran MIPAS'],['MATEMATIKA','Matematika'],['IPA','IPA'],['IPS','IPS']];
    const levelOpts=[['','Semua kesulitan'],['MUDAH','Mudah'],['SEDANG','Sedang'],['SULIT','Sulit'],['HOTS','HOTS']];
    const clsOpts=[['','Campuran kelas IV–VI'],['4','Kelas IV'],['5','Kelas V'],['6','Kelas VI']];
    function dashboard(){const c=S.boot?.counts||{};return `<section class="hero"><div><div class="eyebrow">Selamat datang, pejuang olimpiade!</div><h1>Berpikir Cepat.<br>Menjawab Tepat. Jadi Juara!</h1><p>Berlatih Matematika, IPA dan IPS sesuai format Cerdas Cermat MIPAS SEA Competition 2026.</p><div class="top-spacer"></div><button class="btn gold" data-action="navigate" data-page="practice">🚀 Mulai Latihan</button></div><div class="hero-art">🏆</div></section>${heading('Bank Soal Siap Digunakan','Soal tersimpan di Google Spreadsheet dan dapat diperbarui guru.')}
      <div class="grid cols-4">${[['📚','Total soal',S.boot?.totalQuestions||0],['🔢','Matematika',c.MATEMATIKA||0],['🌿','IPA',c.IPA||0],['🌏','IPS',c.IPS||0]].map(([ico,t,n])=>card(`<div class="stat"><div class="stat-icon">${ico}</div><div><small>${t}</small><strong>${n}</strong></div></div>`)).join('')}</div>
      ${heading('Pilih Arena Latihan','Bersiap menghadapi tiga babak sesuai petunjuk teknis lomba.')}
      <div class="grid cols-3">${modeCard('🧠','Latihan Mandiri','Pilih kelas, mata pelajaran, dan kesulitan.','practice')}${modeCard('📝','Penyisihan & Semifinal','30 soal, 45 menit, skor maksimal 120.','exam')}${modeCard('⚡','Final & Rebutan','Tiga tim, soal wajib, buzzer, dan papan skor.','final')}</div>
      <div class="top-spacer"></div><div class="notice">📌 <strong>Aturan resmi:</strong> Penyisihan dan semifinal terdiri atas 10 Matematika, 10 IPA, dan 10 IPS. Final terdiri atas 6 soal wajib per tim dan 15 soal rebutan. Kegiatan ini merupakan aplikasi <strong>latihan</strong>, bukan perangkat yang boleh digunakan di arena lomba.</div>`;}
    function modeCard(ico,title,desc,page){return `<div class="mode-card"><div class="mode-icon">${ico}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="btn secondary" data-action="navigate" data-page="${page}">Buka Mode →</button></div>`;}
    function practice(){return `${heading('Latihan Mandiri & Cepat','Atur sesi latihan sesuai kemampuan murid.')}${card(`<div class="grid form-grid three">${input('Nama murid / tim','teamName','','text','Contoh: Tim Elang')}${select('Jenis latihan','trainMode',[['LATIHAN','Latihan mandiri'],['CEPAT','Latihan cepat']])}${select('Mata pelajaran','trainMapel',subjOpts)}${select('Kelas','trainKelas',clsOpts)}${select('Tingkat kesulitan','trainLevel',levelOpts)}${select('Jumlah soal','trainCount',[['10','10 soal'],['20','20 soal'],['30','30 soal'],['50','50 soal']])}${select('Timer latihan','trainTimed',[['false','Tanpa batas waktu'],['true','1 menit per soal']])}${select('Waktu tiap soal (mode cepat)','fastSeconds',[['10','10 detik'],['15','15 detik'],['20','20 detik'],['30','30 detik']])}</div><div class="top-spacer"></div><button class="btn" data-action="startPractice">▶ Mulai Latihan</button>`)}<div class="top-spacer"></div><div class="notice">Soal diacak dari database. Kunci dan pembahasan akan tampil setelah hasil dikumpulkan.</div>`;}
    function exam(){return `${heading('Simulasi Cerdas Cermat','Babak tertulis dikerjakan berkelompok oleh tiga murid.')}${card(`<div class="notice warning">⏱️ Waktu 45 menit · 30 pilihan ganda · 10 Matematika + 10 IPA + 10 IPS · benar +4 · salah/kosong 0</div><div class="top-spacer"></div><div class="grid form-grid">${select('Pilih babak','examMode',[['PENYISIHAN','Babak Penyisihan'],['SEMIFINAL','Babak Semifinal']])}${input('Nama tim','examTeam','','text','Contoh: Tim Garuda')}${input('Anggota 1','member1','','text','Nama murid pertama')}${input('Anggota 2','member2','','text','Nama murid kedua')}${input('Anggota 3','member3','','text','Nama murid ketiga')}</div><div class="top-spacer"></div><button class="btn" data-action="startExam">🏁 Mulai Simulasi 45 Menit</button>`)}${S.token?`<div class="top-spacer"></div><div class="btn-row"><button class="btn secondary" data-action="loadRanking" data-mode="PENYISIHAN">Klasemen Penyisihan</button><button class="btn secondary" data-action="loadRanking" data-mode="SEMIFINAL">Klasemen Semifinal</button></div>${S.ranking?renderRanking():''}`:''}`;}
    function renderRanking(){return card(`<h3>Klasemen ${esc(S.ranking.mode)}</h3><div class="scroll-x"><table class="data-table"><thead><tr><th>Peringkat</th><th>Tim</th><th>Skor</th><th>Waktu</th><th>Keterangan</th></tr></thead><tbody>${S.ranking.items.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.team)}</td><td><strong>${r.score}</strong></td><td>${clock(r.seconds)}</td><td>${r.qualified?'<span class="pill green">Zona lolos</span>':'<span class="pill">Cadangan</span>'}</td></tr>`).join('')}</tbody></table></div>`);}
    function quiz(){const session=S.session;if(!session)return dashboard();const qs=session.questions,idx=S.questionIndex,q=qs[idx];const count=Object.keys(S.answers).filter(k=>S.answers[k]).length;const fraction=Math.round(count/qs.length*100);const deadline=Number(session.deadline);return `<div class="quiz-top"><div><div class="pill">${esc(session.mode)} • ${esc(session.teamName)}</div><h2 style="margin:9px 0 0">Soal ${idx+1} dari ${qs.length}</h2></div><div class="timer" id="quizTimer">${deadline?'--:--':'Tanpa timer'}</div></div><div class="progress"><div style="width:${fraction}%"></div></div><div class="quiz-layout"><div>${card(`<div class="question-actions"><span class="pill">${esc(q.mapel)} • Kelas ${q.kelas}</span><span class="subtle">${esc(q.topik)}</span></div><div class="question-text">${esc(q.text)}</div>${q.options.map((opt,i)=>`<button class="option ${S.answers[q.id]==='ABCD'[i]?'selected':''}" data-action="answer" data-key="${'ABCD'[i]}"><span class="option-letter">${'ABCD'[i]}</span><span>${esc(opt)}</span></button>`).join('')}<div class="question-control"><button class="btn secondary" data-action="previous" ${idx===0?'disabled':''}>← Sebelumnya</button>${idx<qs.length-1?`<button class="btn" data-action="next">Berikutnya →</button>`:`<button class="btn good" data-action="submitQuiz">Kumpulkan ✓</button>`}</div>`)}
        </div><div>${card(`<h3 style="margin:0 0 5px">Navigasi Soal</h3><p class="subtle">${count} dari ${qs.length} sudah dijawab</p><div class="number-grid">${qs.map((item,i)=>`<button data-action="jump" data-index="${i}" class="${i===idx?'current':S.answers[item.id]?'done':''}">${i+1}</button>`).join('')}</div><hr class="separator"><p class="subtle">Hijau = sudah dijawab. Biru = soal aktif.</p><button class="btn good full" data-action="submitQuiz">✓ Kumpulkan Jawaban</button>`)}<div class="top-spacer"></div><div class="notice">Jawaban disimpan selama latihan. Gunakan tombol kumpulkan jika sudah selesai.</div></div></div>`;}
    function resultView(){const r=S.review;if(!r)return dashboard();const pct=Math.round(100*r.score/Math.max(1,r.maximum));const entries=S.reviewOnlyWrong?r.items.filter(x=>!x.correct):r.items;return `${card(`<div style="text-align:center"><div style="font-size:48px">${pct>=80?'🏆':pct>=60?'🌟':'📚'}</div><div class="eyebrow" style="color:#6173a8">HASIL LATIHAN</div><div class="result-score">${r.score}<span style="font-size:22px;letter-spacing:0;color:#91a0be"> / ${r.maximum}</span></div><h2>${pct}% ketepatan</h2><p class="subtle">${r.correct} dari ${r.total} jawaban benar</p><div class="btn-row" style="justify-content:center"><button class="btn" data-action="navigate" data-page="practice">Latihan Lagi</button><button class="btn secondary" data-action="toggleWrong">${S.reviewOnlyWrong?'Lihat Semua':'Lihat yang Salah'}</button><button class="btn ghost" data-action="print">Cetak Hasil</button></div></div>`)}${heading('Kunci Jawaban dan Pembahasan','Gunakan untuk memperbaiki materi yang belum dikuasai.')}${entries.map((q,i)=>`<div class="result-answer ${q.correct?'correct':'wrong'}"><strong>${esc(q.mapel)} • ${esc(q.topik)}</strong><div>${esc(q.text)}</div><p>Jawabanmu: <b>${esc(q.chosen||'Tidak dijawab')}</b> &nbsp; | &nbsp; Kunci: <b>${esc(q.answer)}</b> — ${esc(q.options['ABCD'.indexOf(q.answer)]||'')}</p><p>💡 ${esc(q.explanation)}</p></div>`).join('')||card('<div class="empty">Hebat, tidak ada jawaban salah! 🎉</div>')}`;}

    }
    function finalView(){if(!S.token)return loginRequired('Simulasi Final');if(!S.final){return heading('Arena Final & Buzzer','Tiga tim bertanding pada sesi wajib dan rebutan.')+card(`<div class="notice">Sesi I: enam soal wajib per tim, 30 detik/soal. Sesi II: 15 soal rebutan, benar +10 dan salah −5.</div><div class="top-spacer"></div><div class="grid form-grid three">${input('Nama Tim Merah','finalTeam1','Tim Merah')}${input('Nama Tim Biru','finalTeam2','Tim Biru')}${input('Nama Tim Hijau','finalTeam3','Tim Hijau')}</div><div class="top-spacer"></div><button class="btn" data-action="newFinal">🏆 Mulai Pertandingan Baru</button><hr class="separator"><h3>Melanjutkan Pertandingan</h3><p class="subtle">Jika halaman dimuat ulang, pertandingan terakhir dapat dibuka kembali.</p><button class="btn secondary" data-action="resumeFinal">↻ Muat Pertandingan Terakhir</button>`);}
      const f=S.final,q=f.question,phaseNames={WAJIB:'SESI I • SOAL WAJIB',REBUTAN:'SESI II • SOAL REBUTAN',TAMBAHAN:'BABAK TAMBAHAN',SELESAI:'PERTANDINGAN SELESAI'};
      const players=f.teams.map((t,i)=>`<div class="team-score ${f.mandatoryTeam===i||S.buzzTeam===i?'active':''}"><h3>${['🔴','🔵','🟢'][i]} ${esc(t.name)}</h3><strong>${t.score}</strong><span class="subtle">poin</span></div>`).join('');
      if(f.phase==='SELESAI'){const ranking=f.teams.slice().sort((a,b)=>b.score-a.score);return `${heading('Hasil Pertandingan Final','Selamat untuk para pemenang!')}
        <div class="notice success">🏆 Pertandingan selesai. Semua hasil tersimpan di Google Spreadsheet.</div><div class="final-scores">${players}</div><div class="podium"><div class="place"><span>🥈</span><strong>${esc(ranking[1].name)}</strong><small>${ranking[1].score} poin</small></div><div class="place"><span>🥇</span><strong>${esc(ranking[0].name)}</strong><small>${ranking[0].score} poin</small></div><div class="place"><span>🥉</span><strong>${esc(ranking[2].name)}</strong><small>${ranking[2].score} poin</small></div></div><button class="btn" data-action="resetFinal">Pertandingan Baru</button>`;}
      const required=f.phase==='WAJIB'; const canBuzz=!required&&!S.finalExpired;
      return `<div class="quiz-top"><div><div class="pill gold">${esc(phaseNames[f.phase]||f.phase)}</div><h2 style="margin:8px 0">${f.total?`Soal ${f.index+1} / ${f.total}`:`Soal Tambahan ${f.index+1}`}</h2></div><div class="timer" id="finalTimer">${S.finalDeadline?'--:--':'⏱ '+(required?'00:30':'03:00')}</div></div><div class="final-scores">${players}</div>
      ${card(`<div class="question-actions"><span class="pill">${esc(q?.mapel||'')} • Kelas ${esc(q?.kelas||'')}</span>${required?`<span class="pill gold">Giliran: ${esc(f.teams[f.mandatoryTeam]?.name||'')}</span>`:`<span class="pill">${S.buzzTeam===null?'Menunggu buzzer':'Pemenang buzzer: '+esc(f.teams[S.buzzTeam]?.name)}</span>`}</div>
      <div class="question-text">${esc(q?.text||'Soal tidak tersedia')}</div>
      <div class="btn-row"><button class="btn secondary" data-action="startFinalTimer">▶ Mulai Timer / Bacakan Soal</button><button class="btn ghost" data-action="toggleFinalAnswer">${S.showFinalAnswer?'Sembunyikan Kunci':'👁️ Lihat Kunci Guru'}</button></div>
      ${S.showFinalAnswer?`<div class="notice success" style="margin-top:16px"><strong>Kunci: ${esc(q?.answerText||q?.answer||'')}</strong><div>${esc(q?.explanation||'')}</div></div>`:''}
      ${required?`<div class="score-action"><button class="btn good" data-action="judge" data-team="${f.mandatoryTeam}" data-result="BENAR">✓ Benar +10</button><button class="btn danger" data-action="judge" data-team="${f.mandatoryTeam}" data-result="SALAH">✕ Salah 0</button><button class="btn ghost" data-action="judge" data-team="${f.mandatoryTeam}" data-result="KOSONG">Lewat / Waktu Habis 0</button></div>`:
      `<h3 style="margin:20px 0 6px">Tekan buzzer untuk merebut hak menjawab</h3><div class="buzzer-grid">${f.teams.map((t,i)=>`<button class="buzzer ${S.buzzTeam===i?'winner':''}" data-action="buzz" data-team="${i}" ${!canBuzz||S.buzzTeam!==null||!f.eligible.includes(i)?'disabled':''}>🔔<br>${esc(t.name)}</button>`).join('')}</div>${S.buzzTeam!==null?`<div class="notice">🎙️ ${esc(f.teams[S.buzzTeam].name)} mendapat hak menjawab melalui juru bicara.</div><div class="score-action"><button class="btn good" data-action="judge" data-team="${S.buzzTeam}" data-result="BENAR">✓ Benar +10</button><button class="btn danger" data-action="judge" data-team="${S.buzzTeam}" data-result="SALAH">✕ Salah −5</button><button class="btn secondary" data-action="passFinal" data-team="${S.buzzTeam}">↪ Lempar (Hening 3 Detik)</button></div>`:''}<div class="btn-row"><button class="btn ghost" data-action="finalExpire">Hangus / Tidak Terjawab</button><span class="subtle">Maksimal tiga menit per soal rebutan.</span></div>`}`)}
      <div class="top-spacer"></div><div class="question-actions">${f.logs.length?`<small class="subtle">Riwayat: ${f.logs.slice(-3).map(l=>`${esc(f.teams[l.team]?.name)} ${esc(l.action)} (${l.change>0?'+':''}${l.change})`).join(' • ')}</small>`:'<small class="subtle">Penilaian operator disimpan setelah setiap soal.</small>'}<button class="btn ghost sm" data-action="resetFinal">Keluar dari pertandingan</button></div>`;}
    function bankView(){if(!S.token)return loginRequired('Bank Soal Guru');const b=S.bank;return `${heading('Bank Soal Guru','Tambah, edit, nonaktifkan, impor, dan ekspor soal melalui Spreadsheet.')}
      <div class="btn-row"><button class="btn" data-action="newQuestion">＋ Tambah Soal</button><button class="btn secondary" data-action="importCsv">⬆ Impor CSV</button><button class="btn secondary" data-action="exportCsv">⬇ Ekspor CSV</button><button class="btn ghost" data-action="templateCsv">Unduh Template</button><button class="btn ghost" data-action="loadBank">↻ Segarkan</button></div><input type="file" accept=".csv,text/csv" id="csvFile" class="hide">
      ${S.editing?questionEditor():''}<div class="top-spacer"></div>${card(`<div class="grid form-grid three">${input('Cari soal','filterSearch',S.bankFilter.search,'text','Kata kunci...')}${select('Mata pelajaran','filterSubject',subjOpts,S.bankFilter.mapel)}${select('Kelas','filterGrade',clsOpts,S.bankFilter.kelas)}</div><div class="top-spacer"></div><button class="btn secondary sm" data-action="applyBankFilter">🔎 Terapkan Filter</button><div class="top-spacer"></div>
      ${!b?'<div class="empty"><span class="load"></span><strong>Memuat bank soal...</strong></div>':`<div class="subtle">${b.total} soal ditemukan. Halaman ${b.page+1} dari ${Math.max(1,Math.ceil(b.total/30))}.</div><div class="scroll-x"><table class="data-table"><thead><tr><th>ID</th><th>Mapel / Kelas</th><th>Babak</th><th>Pertanyaan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${b.items.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.mapel)}<br>Kelas ${q.kelas}</td><td>${esc(q.babak)}<br>${esc(q.level)}</td><td class="question-cell">${esc(q.text)}</td><td><span class="pill ${q.active?'green':'red'}">${q.active?'Aktif':'Nonaktif'}</span></td><td><button class="btn secondary sm" data-action="editQuestion" data-id="${esc(q.id)}">Edit</button> <button class="btn ghost sm" data-action="disableQuestion" data-id="${esc(q.id)}">Nonaktifkan</button></td></tr>`).join('')}</tbody></table></div><div class="btn-row" style="justify-content:flex-end;margin-top:14px"><button class="btn secondary sm" data-action="bankPrevious" ${b.page===0?'disabled':''}>← Sebelumnya</button><button class="btn secondary sm" data-action="bankNext" ${(b.page+1)*30>=b.total?'disabled':''}>Berikutnya →</button></div>`}`)}`;}
    function questionEditor(){const q=S.editing;return `<div class="top-spacer"></div>${card(`<div class="question-actions"><h3>${q.id?'Edit Soal':'Tambah Soal'}</h3><button class="btn ghost sm" data-action="cancelEditor">Tutup ✕</button></div><div class="grid form-grid three">${select('Mapel','qMapel',subjOpts.slice(1),q.mapel||'MATEMATIKA')}${select('Kelas','qKelas',clsOpts.slice(1),q.kelas||4)}${input('Topik','qTopik',q.topik||'','text','Contoh: Pecahan')}${select('Babak','qBabak',[['UMUM','Umum'],['PENYISIHAN','Penyisihan'],['SEMIFINAL','Semifinal'],['FINAL_WAJIB','Final Wajib'],['FINAL_REBUTAN','Final Rebutan']],q.babak||'UMUM')}${select('Level','qLevel',levelOpts.slice(1),q.level||'SEDANG')}${select('Tipe','qTipe',[['PG','Pilihan Ganda'],['LISAN','Lisan']],q.tipe||'PG')}</div><div class="top-spacer"></div><div class="field"><label for="qText">Pertanyaan</label><textarea id="qText" rows="3">${esc(q.text||'')}</textarea></div><div class="top-spacer"></div><div class="grid form-grid"><div>${input('Opsi A','qA',(q.options||[])[0]||'')}</div><div>${input('Opsi B','qB',(q.options||[])[1]||'')}</div><div>${input('Opsi C','qC',(q.options||[])[2]||'')}</div><div>${input('Opsi D','qD',(q.options||[])[3]||'')}</div></div><div class="top-spacer"></div><div class="grid form-grid">${input('Kunci (A/B/C/D untuk PG)','qAnswer',q.answer||'A')}<div>${select('Status','qActive',[['true','Aktif'],['false','Nonaktif']],q.active===false?'false':'true')}</div></div><div class="top-spacer"></div><div class="field"><label for="qExplanation">Pembahasan</label><textarea id="qExplanation" rows="3">${esc(q.explanation||'')}</textarea></div><div class="top-spacer"></div><button class="btn good" data-action="saveQuestion">💾 Simpan Soal</button>`)}`;}
    function statsView(){
      if(!S.token)return loginRequired('Statistik & Evaluasi');
      const t=S.stats;
      let out=heading('Statistik dan Evaluasi','Riwayat latihan tersimpan dalam Google Spreadsheet.');
      if(!t)return out+card('<div class="empty">Sedang mengambil data...</div>');
      out+='<div class="grid cols-3">';
      out+=card(`<div class="stat"><div class="stat-icon">📊</div><div><small>Sesi selesai</small><strong>${t.sessions}</strong></div></div>`);
      out+=card(`<div class="stat"><div class="stat-icon">🎯</div><div><small>Rata-rata ketepatan</small><strong>${t.average}%</strong></div></div>`);
      out+=card(`<div class="stat"><div class="stat-icon">📈</div><div><small>Riwayat ditampilkan</small><strong>${t.recent.length}</strong></div></div>`);
      out+='</div>'+heading('Perkembangan Nilai','Berdasarkan sesi terakhir.');
      const bars=t.recent.length?`<div style="display:flex;align-items:end;gap:8px;height:140px;border-bottom:1px solid var(--line)">${t.recent.slice(0,20).reverse().map(r=>`<div style="flex:1;background:linear-gradient(#8ca1ff,#4469d7);height:${Math.max(2,Math.round(r.score/Math.max(1,r.max)*100))}%;border-radius:5px 5px 0 0" title="${esc(r.team)}: ${r.score}/${r.max}"></div>`).join('')}</div>`:'<div class="empty">Belum ada hasil latihan.</div>';
      out+=card(bars)+heading('Ketepatan per Mata Pelajaran','Berdasarkan paling banyak 200 sesi terakhir.');
      out+=card(`<div class="grid cols-3">${['MATEMATIKA','IPA','IPS'].map(m=>{const v=t.subjectStats?.[m]||{correct:0,total:0};const pct=v.total?Math.round(100*v.correct/v.total):0;return `<div><strong>${esc(m)}</strong><p class="subtle">${v.correct}/${v.total} benar • ${pct}%</p><div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join('')}</div>`);
      if(t.weakTopics?.length){out+=heading('Materi yang Perlu Ditingkatkan','Topik dengan persentase jawaban benar paling rendah.');out+=card(t.weakTopics.map(v=>{const pct=Math.round(100*v.correct/v.total);return `<div style="margin-bottom:14px"><div class="question-actions"><strong>${esc(v.topic)}</strong><span class="subtle">${v.correct}/${v.total} benar • ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join(''));}
      out+=heading('Riwayat Lengkap (50 Terbaru)');
      const tableRows=t.recent.map(r=>`<tr><td>${esc(r.team)}</td><td>${esc(r.mode)}</td><td>${r.score}/${r.max}</td><td>${Math.round(100*r.score/Math.max(1,r.max))}%</td><td>${clock(r.duration)}</td><td>${fmtDate(r.finished)}</td></tr>`).join('');
      out+=card(`<div class="scroll-x"><table class="data-table"><thead><tr><th>Tim/Murid</th><th>Mode</th><th>Nilai</th><th>Persentase</th><th>Durasi</th><th>Tanggal</th></tr></thead><tbody>${tableRows}</tbody></table></div>`);
      return out;
    }
    function settingsView(){if(!S.token)return loginRequired('Pengaturan Guru');const settings=S.boot?.settings||{};return `${heading('Pengaturan Aplikasi','Identitas sekolah dan pengalaman belajar.')}${card(`<div class="grid form-grid">${input('Nama sekolah','setSchool',settings.NAMA_SEKOLAH||'')}${input('Nama pembina','setTeacher',settings.NAMA_PEMBINA||'')}${input('Judul aplikasi','setTitle',settings.JUDUL||'')}</div><div class="top-spacer"></div><button class="btn good" data-action="saveSettings">💾 Simpan Pengaturan</button><hr class="separator"><div class="btn-row"><button class="btn secondary" data-action="toggleSound">${S.sound?'🔊 Suara Aktif':'🔇 Suara Nonaktif'}</button><button class="btn secondary" data-action="fullscreen">⛶ Layar Penuh</button><button class="btn danger" data-action="logout">Keluar Mode Guru</button></div><p class="small-note">Untuk mengubah PIN, edit fungsi setAdminPin() lalu jalankan lagi di editor Apps Script.</p>`)}<div class="top-spacer"></div><div class="notice warning">⚠️ Google Spreadsheet jangan dibagikan dengan izin edit kepada murid. Semua fungsi pengelolaan soal memerlukan token guru yang dicek di server.</div>`;}
    function render(){let html='';if(S.page==='dashboard')html=dashboard();else if(S.page==='practice')html=practice();else if(S.page==='exam')html=exam();else if(S.page==='quiz')html=quiz();else if(S.page==='result')html=resultView();else if(S.page==='final')html=finalView();else if(S.page==='bank')html=bankView();else if(S.page==='stats')html=statsView();else if(S.page==='settings')html=settingsView();else html=dashboard();$('#app').innerHTML=layout(html);updateClocks();}
    function sound(freq=660){if(!S.sound)return;try{const AudioContext=window.AudioContext||window.webkitAudioContext;const ctx=new AudioContext();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=.075;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close();},150);}catch(e){/* audio unsupported */}}
    function updateClocks(){if(S.page==='quiz'&&S.session?.deadline){const left=Math.ceil((S.session.deadline-(Date.now()+S.clockOffset))/1000);const el=$('#quizTimer');if(el){el.textContent=clock(left);el.classList.toggle('urgent',left<=60);}if(left<=0&&!S.busy&&!S.submitting)submitQuiz(true);}
      if(S.page==='final'&&S.finalDeadline&&S.final?.phase!=='SELESAI'){const left=Math.ceil((S.finalDeadline-Date.now())/1000);const el=$('#finalTimer');if(el){el.textContent=clock(left);el.classList.toggle('urgent',left<=10);}if(left<=0&&!S.finalExpired){S.finalExpired=true;S.finalDeadline=null;toast('Waktu menjawab habis. Soal ditandai kosong/hangus.');const team=S.final.mandatoryTeam!==null?S.final.mandatoryTeam:(S.buzzTeam!==null?S.buzzTeam:(S.final.eligible?.[0]??0));judgeFinal(team,'KOSONG');}}}
    let saveTimer=null;function queueAnswerSave(){saveDraft();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const activeId=S.session?.id;if(activeId)api('saveAnswers',activeId,S.answers).catch(e=>toast('Jawaban belum tersimpan ke Spreadsheet: '+e.message,true));},550);}
    function validSessionResult(result){return !!(result&&typeof result==='object'&&typeof result.id==='string'&&result.id&&Array.isArray(result.questions)&&result.questions.length);}
    function validFinalResult(result){return !!(result&&typeof result==='object'&&typeof result.id==='string'&&result.id&&Array.isArray(result.teams)&&result.teams.length===3);}
    function serverResponseError(operation){return new Error(`Server tidak mengirim data ${operation} yang lengkap. Pastikan Code.gs dan Index.html menggunakan versi terbaru, jalankan setupDatabase(), lalu perbarui deployment Web App melalui Deploy → Manage deployments → Edit → New version.`);}
    function saveDraft(){if(S.session?.id){try{sessionStorage.setItem('ccDraft_'+S.session.id,JSON.stringify(S.answers));}catch(e){/* penyimpanan lokal opsional */}}}
    function readDraft(id){try{const value=sessionStorage.getItem('ccDraft_'+id);const parsed=value?JSON.parse(value):{};return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};}catch(e){return {};}}
    async function startSession(options){const result=await run(()=>api('createSession',options));if(!validSessionResult(result))throw serverResponseError('sesi latihan');S.session=result;S.questionIndex=0;S.answers={};S.review=null;S.page='quiz';sessionStorage.setItem('ccActiveSession',result.id);saveDraft();render();}
    async function submitQuiz(auto=false){if(S.submitting||!S.session)return;if(!auto&&!confirm('Kumpulkan semua jawaban sekarang? Jawaban tidak dapat diubah setelah dikumpulkan.'))return;S.submitting=true;clearTimeout(saveTimer);try{const sessionId=S.session.id;const result=await run(()=>api('submitSession',sessionId,S.answers));if(!result||!Array.isArray(result.items))throw serverResponseError('hasil latihan');S.review=result;S.reviewOnlyWrong=false;S.page='result';S.session=null;sessionStorage.removeItem('ccActiveSession');sessionStorage.removeItem('ccDraft_'+sessionId);sound(880);render();}catch(e){toast(e.message||String(e),true);}finally{S.submitting=false;}}
    async function reloadBank(){const data=await run(()=>api('listQuestions',S.token,S.bankFilter));S.bank=data;render();}
    async function reloadStats(){S.stats=await run(()=>api('getStatistics',S.token));render();}
    async function reloadFinal(){if(!S.final?.id)throw serverResponseError('pertandingan final');const result=await run(()=>api('getFinalMatch',S.token,S.final.id));if(!validFinalResult(result))throw serverResponseError('pertandingan final');S.final=result;render();}
    function resetFinalTransient(){S.finalDeadline=null;S.finalExpired=false;S.buzzTeam=null;S.showFinalAnswer=false;S.lastQuestionKey='';}
    async function judgeFinal(team,result){if(!S.final?.id)return;try{const f=await run(()=>api('adjudicateFinal',S.token,S.final.id,team,result));if(!validFinalResult(f))throw serverResponseError('penilaian final');S.final=f;resetFinalTransient();sound(result==='BENAR'?880:result==='SALAH'?230:390);render();}catch(e){toast(e.message||String(e),true);}}
    function csvEscape(v){const value=String(v??'');return /[",\r\n]/.test(value)?'"'+value.replace(/"/g,'""')+'"':value;}
    function csvDownload(filename,rows){const body='\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');const blob=new Blob([body],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
    const csvHead=['id','mapel','kelas','topik','babak','level','tipe','text','A','B','C','D','answer','explanation','active'];
    function parseCsv(text){const rows=[];let row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++;}else if(c==='"')quote=false;else field+=c;}else if(c==='"')quote=true;else if(c===','){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field='';}else field+=c;}row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(quote)throw new Error('CSV memiliki tanda petik yang tidak tertutup.');return rows;}
    async function importCsv(file){if(!file)return;const text=await file.text();const rows=parseCsv(text.replace(/^\ufeff/,''));if(!rows.length)throw new Error('CSV kosong.');const headers=rows.shift().map(s=>s.trim());if(csvHead.some(x=>!headers.includes(x)))throw new Error('Header CSV tidak sesuai template.');const data=rows.map(row=>{const o={};headers.forEach((h,i)=>o[h]=row[i]||'');return {id:o.id,mapel:o.mapel,kelas:o.kelas,topik:o.topik,babak:o.babak,level:o.level,tipe:o.tipe,text:o.text,options:[o.A,o.B,o.C,o.D],answer:o.answer,explanation:o.explanation,active:String(o.active).toLowerCase()!=='false'};});let added=0,skipped=0;for(let i=0;i<data.length;i+=200){const r=await run(()=>api('importQuestions',S.token,data.slice(i,i+200)));added+=r.imported;skipped+=r.skipped;}toast(`Impor selesai: ${added} soal baru, ${skipped} dilewati.`);S.bankFilter.page=0;await reloadBank();}
    function value(id){return document.getElementById(id)?.value||'';}
    async function navigate(page){S.page=page;render();if(page==='bank'&&S.token){try{await reloadBank();}catch(e){}}if(page==='stats'&&S.token){try{await reloadStats();}catch(e){}}}
    async function handleAction(action,el){
      switch(action){
        case 'navigate':await navigate(el.dataset.page);break;
        case 'startPractice':{
          const mode=value('trainMode');const name=value('teamName').trim()||'Murid Hebat';
          await startSession({mode,teamName:name,mapel:value('trainMapel'),kelas:value('trainKelas'),level:value('trainLevel'),count:Number(value('trainCount')||10),timed:value('trainTimed')==='true',fastSeconds:Number(value('fastSeconds')||15)});break;
        }
        case 'startExam':{
          const name=value('examTeam').trim();if(!name){toast('Isi nama tim terlebih dahulu.',true);return;}
          const members=[value('member1'),value('member2'),value('member3')];
          if(members.some(n=>!n.trim())){toast('Isi nama ketiga anggota tim.',true);return;}
          await startSession({mode:value('examMode'),teamName:name,members});break;
        }
        case 'answer':{if(!S.session)return;const q=S.session.questions[S.questionIndex];S.answers[q.id]=el.dataset.key;queueAnswerSave();render();break;}
        case 'previous':S.questionIndex=Math.max(0,S.questionIndex-1);render();break;
        case 'next':S.questionIndex=Math.min(S.session.questions.length-1,S.questionIndex+1);render();break;
        case 'jump':S.questionIndex=Number(el.dataset.index);render();break;
        case 'submitQuiz':await submitQuiz();break;
        case 'toggleWrong':S.reviewOnlyWrong=!S.reviewOnlyWrong;render();break;
        case 'print':window.print();break;
        case 'login':{
          const pin=value('pinInput');if(!pin){toast('Masukkan PIN guru.',true);return;}
          const r=await run(()=>api('loginAdmin',pin));S.token=r.token;sessionStorage.setItem('ccAdminToken',r.token);toast('Berhasil masuk sebagai guru.');
          if(S.page==='bank')await reloadBank();else if(S.page==='stats')await reloadStats();else render();break;
        }
        case 'refreshAdminStatus':{
          const boot=await run(()=>api('getBootstrap'));
          if(!boot||typeof boot!=='object')throw serverResponseError('status aktivasi PIN');
          S.boot=boot;render();
          toast(boot.adminConfigured?'PIN guru sudah aktif. Silakan masuk.':'PIN belum aktif. Buka tab PENGATURAN di Spreadsheet dan isi VALUE pada baris PIN_GURU.',!boot.adminConfigured);
          break;
        }
        case 'logout':await run(()=>api('logoutAdmin',S.token));S.token='';sessionStorage.removeItem('ccAdminToken');S.bank=null;S.stats=null;S.final=null;S.page='dashboard';render();break;
        case 'toggleSound':S.sound=!S.sound;render();break;
        case 'fullscreen':{const root=document.documentElement;if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen();break;}
        case 'saveSettings':{
          S.boot.settings=await run(()=>api('saveSettings',S.token,{NAMA_SEKOLAH:value('setSchool'),NAMA_PEMBINA:value('setTeacher'),JUDUL:value('setTitle')}));toast('Pengaturan tersimpan.');render();break;
        }
        case 'loadRanking':{
          const mode=el.dataset.mode;S.ranking={mode,items:await run(()=>api('leaderboard',S.token,mode))};render();break;
        }
        case 'newFinal':{
          const names=[value('finalTeam1'),value('finalTeam2'),value('finalTeam3')].map(s=>s.trim());if(names.some(n=>!n)){toast('Isi nama ketiga tim.',true);return;}
          const result=await run(()=>api('createFinalMatch',S.token,names));if(!validFinalResult(result))throw serverResponseError('pertandingan final');S.final=result;sessionStorage.setItem('ccFinalId',S.final.id);resetFinalTransient();render();break;
        }
        case 'resumeFinal':{
          const id=sessionStorage.getItem('ccFinalId');if(!id){toast('Belum ada pertandingan terakhir di perangkat ini.',true);return;}
          S.final={id};await reloadFinal();resetFinalTransient();break;
        }
        case 'startFinalTimer':{
          if(!S.finalDeadline&&!S.finalExpired){S.finalDeadline=Date.now()+((S.final.phase==='WAJIB'?30:180)*1000);updateClocks();sound(740);}break;
        }
        case 'toggleFinalAnswer':S.showFinalAnswer=!S.showFinalAnswer;render();break;
        case 'judge':await judgeFinal(Number(el.dataset.team),el.dataset.result);break;
        case 'passFinal':{
          if(!confirm('Lempar soal setelah hening tiga detik?'))return;
          const team=Number(el.dataset.team);const result=await run(()=>api('adjudicateFinal',S.token,S.final.id,team,'LEMPAR'));if(!validFinalResult(result))throw serverResponseError('pelimpahan soal');S.final=result;
          S.buzzTeam=null;S.finalExpired=false;S.showFinalAnswer=false;render();break;
        }
        case 'finalExpire':{
          const team=S.final.mandatoryTeam!==null?S.final.mandatoryTeam:(S.buzzTeam!==null?S.buzzTeam:(S.final.eligible?.[0]??0));await judgeFinal(team,'KOSONG');break;
        }
        case 'resetFinal':S.final=null;resetFinalTransient();render();break;
        case 'loadBank':await reloadBank();break;
        case 'newQuestion':S.editing={mapel:'MATEMATIKA',kelas:4,babak:'UMUM',level:'SEDANG',tipe:'PG',options:['','','',''],answer:'A',active:true};render();break;
        case 'cancelEditor':S.editing=null;render();break;
        case 'editQuestion':S.editing=S.bank?.items?.find(q=>q.id===el.dataset.id)||null;render();window.scrollTo({top:160,behavior:'smooth'});break;
        case 'saveQuestion':{
          const q={id:S.editing.id||'',mapel:value('qMapel'),kelas:Number(value('qKelas')),topik:value('qTopik'),babak:value('qBabak'),level:value('qLevel'),tipe:value('qTipe'),text:value('qText'),options:[value('qA'),value('qB'),value('qC'),value('qD')],answer:value('qAnswer'),explanation:value('qExplanation'),active:value('qActive')==='true'};
          await run(()=>api('saveQuestion',S.token,q));S.editing=null;toast('Soal berhasil disimpan.');await reloadBank();break;
        }
        case 'disableQuestion':{
          if(!confirm('Nonaktifkan soal ini? Data tetap ada di Spreadsheet.'))return;
          await run(()=>api('disableQuestion',S.token,el.dataset.id));toast('Soal dinonaktifkan.');await reloadBank();break;
        }
        case 'applyBankFilter':S.bankFilter={page:0,search:value('filterSearch'),mapel:value('filterSubject'),kelas:value('filterGrade')};await reloadBank();break;
        case 'bankNext':S.bankFilter.page++;await reloadBank();break;
        case 'bankPrevious':S.bankFilter.page=Math.max(0,S.bankFilter.page-1);await reloadBank();break;
        case 'importCsv':$('#csvFile').click();break;
        case 'templateCsv':csvDownload('template_soal_mipas.csv',[csvHead,['','MATEMATIKA','4','Pecahan','UMUM','SEDANG','PG','Berapa 1/2 + 1/2?','1','2','1/2','1/4','A','Penyebut sama, jumlahkan pembilang.','true']]);break;
        case 'exportCsv':{
          const qs=await run(()=>api('exportQuestions',S.token));const rows=[csvHead,...qs.map(q=>[q.id,q.mapel,q.kelas,q.topik,q.babak,q.level,q.tipe,q.text,...q.options,q.answer,q.explanation,q.active])];csvDownload('bank_soal_mipas.csv',rows);toast(`${qs.length} soal diekspor.`);break;
        }
        default:break;
      }
    }
    document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled||el.dataset.action==='buzz')return;ev.preventDefault();handleAction(el.dataset.action,el).catch(err=>toast(err.message||String(err),true));});
    document.addEventListener('pointerdown',ev=>{
      const el=ev.target.closest('[data-action="buzz"]');if(!el||el.disabled||!S.final||S.final.phase==='WAJIB'||S.buzzTeam!==null||S.finalExpired)return;
      const team=Number(el.dataset.team);if(!S.final.eligible.includes(team))return;
      ev.preventDefault();S.buzzTeam=team;sound([530,680,830][team]);render();
    },{passive:false});
    document.addEventListener('change',ev=>{
      if(ev.target.id==='csvFile'&&ev.target.files?.[0]){importCsv(ev.target.files[0]).catch(e=>toast(e.message,true));}
    });
    async function init(){try{const started=Date.now();S.boot=await api('getBootstrap');if(!S.boot||typeof S.boot!=='object')throw serverResponseError('konfigurasi');if(S.boot.serverNow)S.clockOffset=S.boot.serverNow-(started+Date.now())/2;const active=sessionStorage.getItem('ccActiveSession');if(active){try{const r=await api('getSession',active);if(!validSessionResult(r))throw serverResponseError('sesi sebelumnya');if(r.finished){if(!r.review||!Array.isArray(r.review.items))throw serverResponseError('hasil sebelumnya');S.review=r.review;S.page='result';sessionStorage.removeItem('ccActiveSession');sessionStorage.removeItem('ccDraft_'+active);}else{S.session=r;S.answers=Object.assign({},r.answers||{},readDraft(active));S.page='quiz';}}catch(e){sessionStorage.removeItem('ccActiveSession');toast('Sesi lama tidak dapat dipulihkan: '+e.message,true);}}
      render();if(S.boot.version!==CLIENT_VERSION)toast('Versi aplikasi belum sama. Perbarui Code.gs dan Index.html, lalu deploy Web App versi baru.',true);setInterval(updateClocks,1000);
    }catch(e){$('#app').innerHTML=`<main style="max-width:700px;margin:12vh auto;padding:25px"><div class="card"><h2>⚠️ Koneksi belum siap</h2><p>${esc(e.message)}</p><p>Buka aplikasi melalui URL Web App Apps Script dan pastikan fungsi <strong>setupDatabase()</strong> telah dijalankan.</p><button class="btn" onclick="location.reload()">Coba Lagi</button></div></main>`;}}
    init();
  </script>
</body>
